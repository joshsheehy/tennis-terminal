<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tennis Cuts</title>
  <!--
    Bundled inside the iOS app (capacitor.config.json server.errorPath). The
    app loads https://tenniscuts.com live; Capacitor shows this page instead
    of a blank screen when that load fails, e.g. no connection.
  -->
  <style>
    :root { --bg: #f7f6f3; --text: #1b1a17; --muted: #6b6760; --brand: #2f8f37; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151412; --text: #f1efe9; --muted: #a29d93; --brand: #4cc054; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }
    main { max-width: 320px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0 0 24px; }
    button {
      font: inherit;
      font-weight: 600;
      font-size: 16px;
      padding: 12px 28px;
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
    }
    .mark { font-size: 20px; font-weight: 700; }
    .mark span { color: var(--brand); }
  </style>
</head>
<body>
  <main>
    <div class="mark">Tennis<span>Cuts</span></div>
    <h1>You're offline</h1>
    <p>Tennis Cuts needs a connection to load the latest cuts and schedules. Check your signal and try again.</p>
    <button type="button" onclick="window.location.href = 'https://tenniscuts.com/'">Try again</button>
  </main>
</body>
</html>
