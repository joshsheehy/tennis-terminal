name: Q alternate deep discovery
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/q-alt-deep-discovery.yml']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Week 33 forum thread and seagull sources
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          mkdir -p research/q-alt-deep
          python3 - <<'PY' > research/q-alt-deep/week33-forum.txt
          import requests,re,html,datetime,urllib.parse
          from bs4 import BeautifulSoup
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'})
          base='https://britishtennis.activeboard.com/t73108826/entry-week-33-17082026/'
          print('RUN',datetime.datetime.now(datetime.timezone.utc).isoformat())
          for page in range(1,6):
            u=base+(f'?page={page}' if page>1 else '')
            try:r=S.get(u,timeout=25); s=r.text
            except Exception as e: print('ERR',page,e); continue
            print('\n===== PAGE',page,'STATUS',r.status_code,'LEN',len(s),'URL',r.url,'=====')
            soup=BeautifulSoup(s,'html.parser')
            # Extract post containers with author/date/body as robustly as possible.
            posts=[]
            for node in soup.find_all(['table','div']):
              txt=' '.join(node.stripped_strings)
              if len(txt)<30: continue
              if any(k.lower() in txt.lower() for k in ['roehampton','quebec city','kingston','q alt','qualifying','alternate','live-tennis','ticktock','otherlists','chq_updates','darts']):
                # only moderately sized likely post nodes
                if len(txt)<12000: posts.append((txt,str(node)))
            # dedupe text and print most detailed matches
            seen=set()
            for txt,node in posts:
              key=txt[:300]
              if key in seen: continue
              seen.add(key)
              print('\nPOSTLIKE',txt[:10000])
              for m in re.finditer(r'href=["\']([^"\']+)',node,re.I):
                link=html.unescape(m.group(1))
                if re.search(r'tennis|x\.com|twitter|darts|ticktock|livetennis|live-tennis|otherlists|chq|entry',link,re.I): print(' LINK',urllib.parse.urljoin(r.url,link))
            # exact contexts
            for term in ['Roehampton','Quebec City','Kingston','alt','Q Alt','qualifying','live-tennis','TickTock','OtherLists','CHQ_Updates','Darts']:
              for m in list(re.finditer(re.escape(term),s,re.I))[:30]:
                print('\nCTX',term,re.sub(r'\s+',' ',s[max(0,m.start()-900):m.start()+4500])[:5600])
            # discover pagination/posts IDs
            for a in soup.find_all('a',href=True):
              tx=' '.join(a.stripped_strings); href=urllib.parse.urljoin(r.url,a['href'])
              if re.search(r'lastPostAnchor|page=|post|permalink',href,re.I) and ('73108826' in href): print('THREADLINK',tx,href)
          PY
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/q-alt-deep/week33-forum.txt
          git commit -m "Save Week 33 forum alt-position trace" || exit 0
          git push
