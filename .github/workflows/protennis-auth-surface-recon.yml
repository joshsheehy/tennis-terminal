name: ProTennisLive auth surface recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/protennis-auth-surface-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Search official Swagger for acceptance-list metadata
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          url='https://api.protennislive.com/feeds/swagger/orgclient/swagger.json'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r: raw=r.read()
          text=raw.decode('utf-8','replace')
          spec=json.loads(raw)
          for term in ['cutoff','cut off','original','ranking date','rankdate','acceptance','alternate','entrycode','entry code','list date']:
            pos=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
            print('\nTERM',term,'COUNT',len(pos),flush=True)
            for p in pos[:30]: print(re.sub(r'\s+',' ',text[max(0,p-500):p+1000])[:1500],flush=True)
          # Enumerate any field names whose name suggests entry/cut/list metadata.
          fields=set()
          def walk(v):
            if isinstance(v,dict):
              for k,val in v.items():
                if any(x in k.lower() for x in ['cut','entry','accept','alternate','rankdate','listdate']): fields.add(k)
                walk(val)
            elif isinstance(v,list):
              for x in v: walk(x)
          walk(spec)
          print('\nMATCHING_FIELD_NAMES',sorted(fields),flush=True)
          PY
