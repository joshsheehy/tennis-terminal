name: ProTennisLive auth surface recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/protennis-auth-surface-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect official Swagger auth metadata and PlayerList contracts
        run: |
          python3 - <<'PY'
          import json, re, urllib.request

          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for profile in ['orgclient','tournamentclient']:
            url=f'https://api.protennislive.com/feeds/swagger/{profile}/swagger.json'
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
              raw=r.read(); spec=json.loads(raw)
            text=raw.decode('utf-8','replace')
            print('\n===== PROFILE',profile,'=====',flush=True)
            print('INFO',json.dumps(spec.get('info',{}),ensure_ascii=False)[:5000],flush=True)
            print('SERVERS',json.dumps(spec.get('servers'),ensure_ascii=False),flush=True)
            print('SECURITY',json.dumps(spec.get('security'),ensure_ascii=False),flush=True)
            print('SCHEMES',json.dumps(spec.get('components',{}).get('securitySchemes',{}),ensure_ascii=False)[:5000],flush=True)
            print('ALL_PATHS',list(spec.get('paths',{}).keys()),flush=True)
            for p,ops in spec.get('paths',{}).items():
              if any(k in p.lower() for k in ['playerlist','participants','token','auth','login']):
                print('PATH_CONTRACT',p,json.dumps(ops,ensure_ascii=False)[:12000],flush=True)
            schemas=spec.get('components',{}).get('schemas',{})
            for s in ['TournamentPlayerList','TournamentPlayerListItem','PlayerListItem','TournamentCalendar','TournamentCalendarDraws']:
              if s in schemas:
                print('SCHEMA',s,json.dumps(schemas[s],ensure_ascii=False)[:15000],flush=True)
            for needle in ['token','authorization','bearer','claim','client','scope','identity','login','oauth']:
              positions=[m.start() for m in re.finditer(needle,text,re.I)]
              print('TERM',needle,'COUNT',len(positions),flush=True)
              for pos in positions[:8]:
                print(' ',re.sub(r'\s+',' ',text[max(0,pos-300):pos+700])[:1000],flush=True)
          PY
