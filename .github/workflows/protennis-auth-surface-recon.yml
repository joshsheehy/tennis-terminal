name: ProTennisLive auth surface recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/protennis-auth-surface-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect official Swagger roster-related schemas
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://api.protennislive.com/feeds/swagger/orgclient/swagger.json'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r: spec=json.loads(r.read())
          schemas=spec.get('components',{}).get('schemas',{})
          for name in [
            'TournamentPlayerList','TournamentPlayerListItem','PlayerListItem',
            'TournamentCalendarDraws','TournamentInfoDraws','DrawParticipants',
            'DrawSingles','DrawQualifyingSingles','DrawDoubles','DrawQualifyingDoubles',
            'TournamentInfo'
          ]:
            print('\nSCHEMA',name,json.dumps(schemas.get(name),ensure_ascii=False)[:20000],flush=True)
          print('\nPLAYERLIST',json.dumps(spec.get('paths',{}).get('/PlayerList/{tournamentYear}/{tournamentId}'),ensure_ascii=False)[:10000],flush=True)
          print('\nPARTICIPANTS',json.dumps(spec.get('paths',{}).get('/Tournaments/participants'),ensure_ascii=False)[:10000],flush=True)
          PY
