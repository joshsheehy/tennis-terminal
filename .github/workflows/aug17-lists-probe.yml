name: Aug 17 lists probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aug17-lists-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch LiveTennis Aug 17 lists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.request
          from html.parser import HTMLParser

          url='https://www.livetennis.it/post/469551/challenger-cancun-quebec-city-kingston-roehampton-praga-e-sion-la-situazione-aggiornata-darderi-si-cancella-da-cancun/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=20) as r:
              body=r.read().decode('utf-8','replace')
              print('STATUS',r.status,'BYTES',len(body),'FINAL',r.geturl())

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__(); self.out=[]; self.skip=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style','noscript'): self.skip+=1
                  if tag in ('p','div','li','h1','h2','h3','h4','br','tr','td','th'): self.out.append('\n')
              def handle_endtag(self,tag):
                  if tag in ('script','style','noscript') and self.skip: self.skip-=1
                  if tag in ('p','div','li','h1','h2','h3','h4','tr'): self.out.append('\n')
              def handle_data(self,data):
                  if not self.skip: self.out.append(data)
          p=Text(); p.feed(body)
          text=html.unescape(''.join(p.out))
          text=re.sub(r'\r','',text)
          text=re.sub(r'[ \t]+',' ',text)
          text=re.sub(r'\n\s*\n+','\n',text)
          # Print just article-related region, bounded before comments/footer when possible.
          start=text.lower().find('challenger cancun')
          if start<0: start=0
          chunk=text[start:]
          for marker in ['Lascia un commento','Articoli correlati','Ultimi articoli']:
              pos=chunk.find(marker)
              if pos>0: chunk=chunk[:pos]
          print('\n---TEXT---\n')
          print(chunk[:120000])
          PY
