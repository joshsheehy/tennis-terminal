name: ATP subdomain recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atp-subdomain-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query public certificate transparency for ATP data domains
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          for domain in ['atppz.com','protennislive.com']:
              url='https://crt.sh/?'+urllib.parse.urlencode({'q':'%.'+domain,'output':'json'})
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              print('\n===',domain,'===',flush=True)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: rows=json.loads(r.read())
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e),flush=True); continue
              names=set()
              for row in rows:
                  for n in str(row.get('name_value','')).splitlines():
                      n=n.strip().lower().lstrip('*.')
                      if n.endswith(domain): names.add(n)
              for n in sorted(names): print(n,flush=True)
              print('COUNT',len(names),flush=True)
          PY
