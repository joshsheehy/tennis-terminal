name: Entry list source probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/entry-list-source-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe centralized ATP entry-list page
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import re
          import urllib.request

          url = 'https://entries.ticktocktennis.com/atp'
          req = urllib.request.Request(
              url,
              headers={
                  'Accept': 'text/html,application/xhtml+xml',
                  'User-Agent': 'Mozilla/5.0 (compatible; TennisCutsEntryListExperiment/1.0)',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              raw = res.read().decode('utf-8', errors='replace')
              print('status', res.status)
              print('content-type', res.headers.get('content-type'))
              print('etag', res.headers.get('etag'))
              print('last-modified', res.headers.get('last-modified'))
              print('bytes', len(raw.encode('utf-8')))

          text = re.sub(r'<script[\s\S]*?</script>', ' ', raw, flags=re.I)
          text = re.sub(r'<style[\s\S]*?</style>', ' ', text, flags=re.I)
          text = re.sub(r'<[^>]+>', ' ', text)
          text = html.unescape(text)
          text = re.sub(r'\s+', ' ', text).strip()

          stamp = re.search(r'(?:Data\s+updated|Updated)\s+([^<]{0,120}?)(?:Tick Tock Tennis|ticktocktennis\.com|$)', text, re.I)
          print('update-stamp', stamp.group(1).strip() if stamp else 'not-found')

          targets = ['Quebec City', 'Cancun', 'Kingston', 'Prague', 'Roehampton', 'Sion']
          for target in targets:
              idx = text.lower().find(target.lower())
              if idx < 0:
                  print(f'[{target}] NOT FOUND')
                  continue
              lo = max(0, idx - 250)
              hi = min(len(text), idx + 1200)
              print(f'[{target}] {text[lo:hi]}')
          PY
