name: Entry list source probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/entry-list-source-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe centralized ATP entry-list page
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import re
          import urllib.request

          url = 'https://entries.ticktocktennis.com/atp'
          req = urllib.request.Request(
              url,
              headers={
                  'Accept': 'text/html,application/xhtml+xml',
                  'User-Agent': 'Mozilla/5.0 (compatible; TennisCutsEntryListExperiment/1.0)',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              raw = res.read().decode('utf-8', errors='replace')
              print('status', res.status)
              print('content-type', res.headers.get('content-type'))
              print('etag', res.headers.get('etag'))
              print('last-modified', res.headers.get('last-modified'))
              print('bytes', len(raw.encode('utf-8')))

          visible = re.sub(r'<script[\s\S]*?</script>', ' ', raw, flags=re.I)
          visible = re.sub(r'<style[\s\S]*?</style>', ' ', visible, flags=re.I)
          visible = re.sub(r'<[^>]+>', ' ', visible)
          visible = html.unescape(visible)
          visible = re.sub(r'\s+', ' ', visible).strip()

          stamp = re.search(r'(?:Data\s+updated|Updated)\s+([^<]{0,120}?)(?:Tick Tock Tennis|ticktocktennis\.com|$)', visible, re.I)
          print('update-stamp', stamp.group(1).strip() if stamp else 'not-found')

          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', raw, flags=re.I)
          print('script-srcs', scripts)

          targets = ['Quebec City', 'Cancun', 'Kingston', 'Prague', 'Roehampton', 'Sion']
          for target in targets:
              idx = raw.lower().find(target.lower())
              if idx < 0:
                  print(f'[{target}] NOT FOUND IN RAW HTML')
                  continue
              lo = max(0, idx - 500)
              hi = min(len(raw), idx + 2500)
              snippet = raw[lo:hi].replace('\n', ' ')
              snippet = re.sub(r'\s+', ' ', snippet)
              print(f'[{target}] RAW {snippet}')
          PY
