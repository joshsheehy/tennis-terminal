name: ATP component API probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atp-component-api-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe same-origin public JSON components
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, re, urllib.error, urllib.parse, urllib.request

          base='https://www.atptour.com/en/-/www'
          tid='3131'
          year='2026'
          referer=f'https://www.atptour.com/en/tournaments/brownsburg%2C-in/{tid}/overview'
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:123.0) Gecko/20100101 Firefox/123.0',
            'Accept':'application/json, text/plain, */*',
            'Accept-Language':'en-US,en;q=0.9',
            'Referer':referer,
            'Sec-Fetch-Dest':'empty','Sec-Fetch-Mode':'cors','Sec-Fetch-Site':'same-origin',
          }
          def fetch(url):
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=10) as r:
                b=r.read(500000)
                return url,r.status,r.headers.get('content-type'),b
            except urllib.error.HTTPError as e:
              return url,e.code,e.headers.get('content-type'),e.read(2000)
            except Exception as e:
              return url,None,None,str(e).encode()

          known='https://www.atptour.com/en/-/www/players/hero/a0e2?v=1'
          u,st,ct,b=fetch(known)
          print('KNOWN',st,ct,len(b),b[:120].decode('utf-8','replace'),flush=True)

          namespaces=['tournaments','tournament','scores','atp-challenger-tour']
          components=[
            'hero','overview','details','tournament-details','tournamentdetails','profile','info',
            'players','player-list','playerlist','participants','participant-list','entries','entry-list','entrylist',
            'acceptance-list','acceptancelist','acceptances','draws','draw','results','schedule','event-details',
          ]
          urls=[]
          for ns in namespaces:
            for c in components:
              roots=[f'{base}/{ns}/{c}/{tid}',f'{base}/{ns}/{c}/{tid}/{year}',f'{base}/{ns}/{c}/{year}/{tid}']
              for root in roots:
                urls.append(root+'?v=1')
                urls.append(root+f'?year={year}&v=1')
          # Also probe page-component looking routes seen in older ATP frontend conventions.
          extras=[
            f'{base}/tournaments/{tid}/overview?v=1&year={year}',
            f'{base}/tournaments/overview/{tid}?v=1&year={year}',
            f'{base}/tournaments/players/{tid}?v=1&year={year}',
            f'{base}/scores/archive/tournament-results/{tid}?year={year}&v=1',
            f'{base}/scores/current/{tid}/players?year={year}&v=1',
          ]
          urls.extend(extras)

          seen=set(); urls=[u for u in urls if not (u in seen or seen.add(u))]
          print('probing',len(urls),'candidate public component URLs',flush=True)
          interesting=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            for url,st,ct,b in ex.map(fetch,urls):
              txt=b.decode('utf-8','replace')
              if st not in (404,403) or (ct and 'json' in ct.lower()):
                interesting.append((url,st,ct,len(b),re.sub(r'\s+',' ',txt[:700])))
          print('INTERESTING',len(interesting),flush=True)
          for x in interesting:
            print(json.dumps(x,ensure_ascii=False),flush=True)
          PY
