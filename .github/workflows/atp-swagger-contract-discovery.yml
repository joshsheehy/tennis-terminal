name: ATP Swagger contract discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atp-swagger-contract-discovery.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Swagger UI config and public contract names
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error

          H={'User-Agent':'Mozilla/5.0 (compatible; TennisCutsOfficialSourceResearch/1.0)','Accept':'*/*'}
          def get(u, timeout=12, limit=2_000_000):
              try:
                  req=urllib.request.Request(u,headers=H)
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status,r.headers,r.read(limit),r.geturl()
              except urllib.error.HTTPError as e:
                  return e.code,e.headers,e.read(limit),u
              except Exception as e:
                  return None,{},str(e).encode(),u

          root='https://api.protennislive.com/feeds/swagger/index.html'
          st,h,b,final=get(root)
          html=b.decode('utf8','replace')
          print('INDEX',st,len(b))
          # ASP.NET/Swashbuckle puts the real URL definitions inline in this page.
          for term in ['urls:', 'orgclient', 'tournamentclient', 'SwaggerUIBundle']:
              p=html.lower().find(term.lower())
              if p>=0:
                  print('HTML_CTX',term,re.sub(r'\s+',' ',html[max(0,p-1200):p+3500])[:5000])

          candidates=[
            'orgclient','tournamentclient','publicclient','websiteclient','webclient',
            'playerclient','playerzoneclient','pzclient','mediaclient','media',
            'tdiclient','tdpclient','dataclient','partnerclient','appclient',
            'mobileclient','digitalclient','externalclient','feedclient','client',
            'internalclient','adminclient','scoreclient','scoringclient','resultsclient'
          ]
          print('\nCONTRACT_PROBE')
          found=[]
          for name in candidates:
              u=f'https://api.protennislive.com/feeds/swagger/{name}/swagger.json'
              st,h,b,final=get(u,timeout=8,limit=500_000)
              ctype=h.get('content-type') if hasattr(h,'get') else None
              title=version=None;paths=None
              if st==200 and b[:1] in (b'{',b'['):
                  try:
                      spec=json.loads(b.decode())
                      title=spec.get('info',{}).get('title');version=spec.get('info',{}).get('version');paths=len(spec.get('paths',{}))
                      found.append((name,title,version,paths))
                  except Exception:pass
              print(name,'status=',st,'bytes=',len(b),'ctype=',ctype,'title=',title,'version=',version,'paths=',paths)
          print('FOUND',found)

          # Compare PlayerList contract details in every discovered ATP spec.
          for name,title,version,_ in found:
              if title!='ProTennis.Api':continue
              u=f'https://api.protennislive.com/feeds/swagger/{name}/swagger.json'
              st,h,b,final=get(u,limit=1_000_000)
              spec=json.loads(b.decode())
              print('\nDOC',name,'globalSecurity=',json.dumps(spec.get('security')))
              for path,ops in spec.get('paths',{}).items():
                  if any(k in path.lower() for k in ['playerlist','rankdate','accept','entry','report','eceas']):
                      print('PATH',path,json.dumps(ops,ensure_ascii=False)[:7000])
              for schema_name,schema in spec.get('components',{}).get('schemas',{}).items():
                  blob=(schema_name+' '+json.dumps(schema)).lower()
                  if any(k in blob for k in ['original cut','cutoff','cut off','ranking date','rankingdate','playerlisttype','entrycode']):
                      print('SCHEMA',schema_name,json.dumps(schema,ensure_ascii=False)[:7000])
          PY
