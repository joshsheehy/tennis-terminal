name: ATP Swagger contract discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atp-swagger-contract-discovery.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect every officially advertised ProTennisLive contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          H={'User-Agent':'Mozilla/5.0 (compatible; TennisCutsOfficialSourceResearch/1.0)','Accept':'application/json,*/*'}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=15) as r:
                      return r.status,r.read(5_000_000)
              except urllib.error.HTTPError as e:return e.code,e.read(1_000_000)
              except Exception as e:return None,str(e).encode()

          docs=['orgclient','tournamentclient','playerclient','playersensitiveclient','draftclient','integrations']
          needles=['accept','alternate','entry','withdraw','commit','cutoff','cut off','original cut','ranking date','rankingdate','playerlist','eceas','report','tournament','draw','qualif','doubles']
          for name in docs:
              u=f'https://api.protennislive.com/feeds/swagger/{name}/swagger.json'
              st,b=get(u)
              print('\n================',name,'status',st,'bytes',len(b),'================')
              if st!=200: print(b[:500].decode('utf8','replace')); continue
              spec=json.loads(b.decode())
              print('INFO',spec.get('info'))
              print('SECURITY',json.dumps(spec.get('security')))
              schemes=spec.get('components',{}).get('securitySchemes',{})
              print('SECURITY_SCHEMES',json.dumps(schemes))
              print('PATH_COUNT',len(spec.get('paths',{})))
              print('ALL_PATHS')
              for p,ops in spec.get('paths',{}).items():
                  summaries=[]
                  for method,op in ops.items():
                      if isinstance(op,dict): summaries.append(f"{method.upper()}:{op.get('summary','')}")
                  print(' ',p,' | '.join(summaries))
              print('RELEVANT_PATH_DETAIL')
              for p,ops in spec.get('paths',{}).items():
                  blob=(p+' '+json.dumps(ops)).lower()
                  hits=[n for n in needles if n in blob]
                  if hits:
                      print(' PATH',p,'HITS',hits)
                      print(json.dumps(ops,ensure_ascii=False)[:12000])
              print('RELEVANT_SCHEMAS')
              for sn,sch in spec.get('components',{}).get('schemas',{}).items():
                  blob=(sn+' '+json.dumps(sch)).lower()
                  hits=[n for n in needles if n in blob]
                  if hits and any(x in hits for x in ['accept','alternate','entry','withdraw','cutoff','cut off','original cut','ranking date','rankingdate','playerlist','eceas','commit']):
                      print(' SCHEMA',sn,'HITS',hits)
                      print(json.dumps(sch,ensure_ascii=False)[:12000])
          PY
