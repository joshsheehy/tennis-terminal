name: Entry deadline alerts

# Emails subscribers before each ATP/Challenger/ITF/Grand Slam entry deadline,
# at the reminder times each subscriber picked (24 / 12 / 1 hours before the
# deadline moment — noon ET for ATP/Challenger/GS, 14:00 GMT for ITF). Runs
# hourly; the endpoint is idempotent (alert_sends dedupes per subscriber +
# deadline + window), so an extra run or a retry never double-emails.
#
# GitHub cron can fire several minutes late in busy periods — irrelevant for
# the 24h/12h reminders, and the 1h reminder still lands ~45-55 min out.

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run? '1' computes without sending"
        required: false
        default: '0'
  schedule:
    - cron: '0 * * * *'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send due deadline alerts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          DRY: ${{ inputs.dry || '0' }}
        run: |
          set -uo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${ADMIN_SECRET:-}" ]; then
            echo "ERROR: Missing APP_URL or ADMIN_SECRET repository secret."
            exit 1
          fi

          BASE="${APP_URL%%/}"
          case "$BASE" in http://*|https://*) ;; *) BASE="https://$BASE" ;; esac

          ok=0
          for attempt in 1 2 3; do
            status=$(curl -sS -m 120 \
                 -H "Accept: application/json" \
                 -H "User-Agent: TennisCutsDeadlineAlerts/1.0" \
                 -H "X-Admin-Secret: $ADMIN_SECRET" \
                 -o /tmp/alerts.json -w "%{http_code}" \
                 "$BASE/api/send-deadline-alerts?dry=$DRY" || echo "000")
            if [ "$status" = "200" ]; then
              ok=1
              break
            fi
            echo "attempt $attempt/3 got HTTP $status; response body:"
            cat /tmp/alerts.json 2>/dev/null || true
            echo
            sleep $((attempt * 5))
          done

          # A misconfigured or down endpoint must fail the run — a silent green
          # check once hid weeks of unsent alerts (missing RESEND_API_KEY).
          if [ "$ok" != "1" ]; then
            echo "ERROR: send-deadline-alerts failed after 3 attempts."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          try:
              with open('/tmp/alerts.json') as f:
                  d = json.load(f)
          except Exception as e:
              print(f"ERROR: could not parse response: {e}")
              raise SystemExit(1)
          print(f"subscribers={d.get('subscribers')} emailsSent={d.get('emailsSent')} "
                f"deadlineHits={d.get('deadlineHits')}")
          dry = bool(d.get('dry'))
          failed = False
          for s in d.get('perSubscriber', []):
              if s.get('newDeadlines'):
                  status = ('dry run' if dry else
                            'sent' if s.get('sent') else f"FAILED ({s.get('error')})")
                  failed = failed or (not dry and not s.get('sent'))
                  print(f"  {s.get('email')}: {s.get('newDeadlines')} deadline(s) "
                        f"[{','.join(str(h) for h in s.get('reminderHours', []))}h] -> {status}")
          sys.exit(1 if failed else 0)
          PY
