name: ATP app gateway probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atp-app-gateway-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe public app gateway routes
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, re, urllib.error, urllib.request

          host='https://app.atptour.com'
          year='2026'; tid='3121'
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127 Safari/537.36',
            'Accept':'application/json, text/plain, */*',
            'Origin':'https://app.atptour.com',
            'Referer':'https://app.atptour.com/',
          }
          def get(label,url):
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=12) as r:
                b=r.read(500000)
                return label,url,r.status,r.headers.get('content-type'),b
            except urllib.error.HTTPError as e:
              return label,url,e.code,e.headers.get('content-type'),e.read(5000)
            except Exception as e:
              return label,url,None,None,str(e).encode()

          controls=[
            ('control-rankings',f'{host}/api/gateway/rankings.ranksglrollrange?fromRank=1&toRank=3'),
            ('control-archive',f'{host}/api/gateway/scores.resultsarchive?eventyear=2025&eventid=336'),
            ('control-live-ch',f'{host}/api/v2/gateway/livematches/website?scoringTournamentLevel=challenger'),
          ]
          for item in controls:
            label,url,st,ct,b=get(*item)
            print('\nCONTROL',label,'STATUS',st,'CTYPE',ct,'BYTES',len(b),'PREFIX',re.sub(r'\s+',' ',b[:300].decode('utf-8','replace')),flush=True)

          qs=[
            f'tournamentYear={year}&tournamentId={tid}',
            f'tournamentyear={year}&tournamentid={tid}',
            f'eventYear={year}&eventId={tid}',
            f'eventyear={year}&eventid={tid}',
            f'year={year}&id={tid}',
          ]
          names=[
            'playerlist','playerlist.playerlist','playerlist.get','playerlist.getplayerlist','playerlist.tournamentplayerlist',
            'tournament.playerlist','tournaments.playerlist','tournament.players','tournaments.players',
            'tournament.participants','tournaments.participants','tournament.entries','tournaments.entries',
            'tournament.entrylist','tournaments.entrylist','tournament.acceptancelist','tournaments.acceptancelist',
            'scores.playerlist','scores.players','scores.participants','scores.entries',
            'entries.playerlist','entries.tournament','participants.tournament','players.tournament',
          ]
          candidates=[]
          for name in names:
            for q in qs[:2]: candidates.append((name, f'{host}/api/gateway/{name}?{q}'))
          paths=[
            f'/api/gateway/playerlist/{year}/{tid}',f'/api/gateway/PlayerList/{year}/{tid}',
            f'/api/v2/gateway/playerlist/{year}/{tid}',f'/api/v2/gateway/PlayerList/{year}/{tid}',
            f'/api/gateway/tournament/playerlist/{year}/{tid}',f'/api/gateway/tournaments/playerlist/{year}/{tid}',
            f'/api/v2/gateway/tournaments/{year}/{tid}/players',f'/api/v2/gateway/tournaments/{year}/{tid}/entries',
            f'/api/v2/gateway/tournaments/{year}/{tid}/participants',f'/api/v2/gateway/tournaments/{year}/{tid}/playerlist',
            f'/api/v2/gateway/tournament/{year}/{tid}/players',f'/api/v2/gateway/tournament/{year}/{tid}/playerlist',
          ]
          candidates += [('path-'+str(i),host+p) for i,p in enumerate(paths)]

          print('\nCANDIDATES',len(candidates),flush=True)
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            futs=[ex.submit(get,*x) for x in candidates]
            for f in concurrent.futures.as_completed(futs):
              results.append(f.result())
          # Print all non-404 responses, plus representative 404/403/other shapes.
          reps={}
          for label,url,st,ct,b in sorted(results,key=lambda x:x[1]):
            text=b.decode('utf-8','replace')
            if st not in (404,403):
              print('HIT',json.dumps({'label':label,'url':url,'status':st,'ctype':ct,'bytes':len(b),'prefix':re.sub(r'\s+',' ',text[:700])},ensure_ascii=False),flush=True)
            key=(st,ct,re.sub(r'\s+',' ',text[:120]))
            reps.setdefault(key,(label,url,len(b)))
          print('\nRESPONSE_SHAPES',len(reps),flush=True)
          for (st,ct,prefix),(label,url,n) in list(reps.items())[:30]:
            print(json.dumps({'status':st,'ctype':ct,'bytes':n,'example':url,'prefix':prefix},ensure_ascii=False),flush=True)
          PY
