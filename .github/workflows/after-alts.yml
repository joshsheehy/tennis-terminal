name: Cut after alternates

# Keeps "N after alts" current as new cuts arrive (cut-sync.yml imports the cuts themselves).
#
#   1. Capture the official ATP singles ranking list. ProTennisLive only ever holds the current one, and
#      a draw is judged on the list from the Monday before its tournament week.
#   2. Re-read the sheets of recent events: alternates keep getting in after a draw is first posted.
#   3. Compute and store. Draws that cannot be placed with certainty are left alone.
#
# Doubles needs the ATP doubles ranking list, which has no file the server can fetch; those draws wait for
# a manual pass (GET /api/after-alts?pending=doubles lists them).
#
# Shares cut-sync's concurrency group so the two never split protennislive.com's request allowance.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the computed values (false = report only)'
        required: false
        default: 'false'
      days:
        description: 'Re-read sheets of events that started within this many days'
        required: false
        default: '10'
  schedule:
    # Daily. Monday captures the new ranking list; the week's later runs pick up late alternates.
    - cron: '35 14 * * *'
    - cron: '35 22 * * 1,3,5'

concurrency:
  group: cut-sync
  cancel-in-progress: false

jobs:
  after-alts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Capture rankings, re-read recent sheets, compute
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
          DAYS: ${{ inputs.days || '10' }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then echo "Missing APP_URL repository secret."; exit 1; fi
          if [ -z "${ADMIN_SECRET:-}" ]; then echo "Missing ADMIN_SECRET repository secret."; exit 1; fi

          python3 - <<'PY'
          import base64
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['APP_URL'].strip().rstrip('/')
          if not base.startswith(('http://', 'https://')):
              base = 'https://' + base
          secret = os.environ['ADMIN_SECRET']
          apply = os.environ.get('APPLY') == 'true'
          days = int(os.environ.get('DAYS') or 10)

          def app(path, body=None, timeout=240):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  method='POST' if body is not None else 'GET',
                  headers={'Accept': 'application/json', 'Content-Type': 'application/json',
                           'User-Agent': 'TennisCutsAfterAlts/1.0', 'X-Admin-Secret': secret},
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      return json.loads(res.read().decode('utf-8', errors='replace'))
              except urllib.error.HTTPError as exc:
                  return {'ok': False, 'error': f'HTTP {exc.code}: {exc.read().decode("utf-8", errors="replace")[:200]}'}

          def fetch_pdf(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; TennisCutsBot/1.0)',
                  'Accept': 'application/pdf,*/*;q=0.8', 'Referer': 'https://www.protennislive.com/'})
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as res:
                          body = res.read()
                          return body if body.startswith(b'%PDF') and len(body) > 4000 else None
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 503):
                          return None
                      time.sleep(20 * attempt)
                  except Exception:
                      time.sleep(3 * attempt)
              return None

          # 1. ranking list
          pdf = fetch_pdf('https://www.protennislive.com/posting/ramr/singles_entry_numerical.pdf')
          if pdf:
              out = app('/api/rankings', {'pdfBase64': base64.b64encode(pdf).decode()})
              print('ranking list:', {k: out.get(k) for k in ('ok', 'listDate', 'players', 'isNew', 'error')})
          else:
              print('ranking list: could not be fetched this run')

          # 2. sheets
          found = app(f'/api/after-alts?targets=true&days={days}&limit=36')
          targets = found.get('targets') or []
          print(f'{len(targets)} sheets to read')
          read = with_alts = failed = 0
          for t in targets:
              body = fetch_pdf(t['url'])
              time.sleep(1.5)
              if body is None:
                  failed += 1
                  continue
              out = app('/api/after-alts', {**t, 'pdfBase64': base64.b64encode(body).decode()})
              if out.get('stored'):
                  read += 1
                  with_alts += bool(out.get('alternates'))
                  if not out.get('complete'):
                      print(f"  {t['slug']} {t['event']} {t['draw']}: a bracket slot could not be read")
              else:
                  failed += 1
                  print(f"  {t['slug']} {t['event']} {t['draw']}: not stored ({out.get('error') or out.get('eventOnSheet')})")
          print(f'read={read} withAlternates={with_alts} notRead={failed}')

          # 3. compute
          out = app(f'/api/after-alts?days={max(days, 21)}&apply={"true" if apply else "false"}')
          if not out.get('ok'):
              raise RuntimeError(f"compute failed: {out.get('error')}")
          print(f"apply={apply} drawsWithAlternates={out['drawsWithAlternates']} unchanged={out['unchanged']} changed={out['changeCount']}")
          for change in out['changes']:
              print('  ', json.dumps(change))
          for reason, keys in (out.get('waiting') or {}).items():
              print(f'  waiting ({len(keys)}): {reason}')

          # A stale list silently stops new draws from being computed, so fail where it can be seen. No list
          # is published in the second week of a two-week event, hence more than two weeks.
          snapshots = [s for s in (app('/api/rankings').get('snapshots') or []) if s['kind'] == 'singles']
          newest = max((s['listDate'] for s in snapshots), default=None)
          age = (datetime.date.today() - datetime.date.fromisoformat(newest)).days if newest else None
          print(f'newest singles ranking list: {newest} ({age} days old)')
          if age is None or age > 16:
              raise RuntimeError('The stored singles ranking list is missing or more than 16 days old.')
          PY
