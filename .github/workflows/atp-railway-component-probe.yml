name: ATP Railway component probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atp-railway-component-probe.yml'
      - 'src/app/api/probe-atp-public-components/route.ts'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for deploy and run protected probe
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail
          base="${APP_URL%/}"
          [[ "$base" == http* ]] || base="https://$base"
          for n in $(seq 1 16); do
            echo "Attempt $n"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 90 \
              -H "X-Admin-Secret: $ADMIN_SECRET" \
              "$base/api/probe-atp-public-components" || true)
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              python3 -m json.tool /tmp/body || cat /tmp/body
              exit 0
            fi
            head -c 500 /tmp/body 2>/dev/null || true
            echo
            sleep 15
          done
          exit 1
