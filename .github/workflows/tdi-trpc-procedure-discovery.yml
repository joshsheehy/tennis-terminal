name: TDI public tRPC procedure discovery
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/tdi-trpc-procedure-discovery.yml']
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Extract public TDI Results tRPC procedure names and request shapes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,urllib.parse,urllib.request,json
          H={'User-Agent':'Mozilla/5.0 (compatible; TennisCutsOfficialSourceResearch/1.0)','Accept':'text/html,*/*'}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=15) as r:return r.read(8_000_000),r.geturl()
          body,final=get('https://results.tennisdata.com/en')
          html=body.decode('utf8','replace')
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
              u=urllib.parse.urljoin(final,src)
              if u not in scripts:scripts.append(u)
          print('scripts',len(scripts))
          terms=['useQuery','queryOptions','prefetch','useSuspenseQuery','useInfiniteQuery','tournamentId','getTournaments','getPlayers','results','matches','tournaments','players']
          for i,u in enumerate(scripts):
              s=get(u)[0].decode('utf8','replace')
              # Search strings that look like trpc procedure names or Next server action labels.
              interesting=set()
              for pat in [
                  r'["\']([A-Za-z][A-Za-z0-9_]*\.[A-Za-z][A-Za-z0-9_.]*)["\']',
                  r'\b([A-Za-z][A-Za-z0-9_]{2,})\.(?:useQuery|useSuspenseQuery|queryOptions|useInfiniteQuery|prefetch)\b',
              ]:
                  for m in re.findall(pat,s):
                      v=m if isinstance(m,str) else m[0]
                      if any(k in v.lower() for k in ['result','match','tournament','player','event','competition','filter','stat']):interesting.add(v)
              if interesting:
                  print('\nSCRIPT',i,u)
                  for v in sorted(interesting)[:200]:print('PROC?',v)
              low=s.lower()
              for term in terms:
                  start=0; shown=0
                  while shown<4:
                      p=low.find(term.lower(),start)
                      if p<0:break
                      ctx=re.sub(r'\s+',' ',s[max(0,p-450):p+1200])
                      if any(k in ctx.lower() for k in ['trpc','tournament','player','result','match']):
                          print('CTX',term,ctx[:1700]);shown+=1
                      start=p+len(term)
          # Inspect serialized server HTML around IDs and server query dehydration keys.
          for term in ['tournamentId','playerId','Indiana Hardcourt','Brownsburg','trpc','queryKey']:
              low=html.lower();p=low.find(term.lower())
              if p>=0:print('\nHTMLCTX',term,re.sub(r'\s+',' ',html[max(0,p-1000):p+2500])[:3600])
          PY
