name: Tennis Cuts data sync

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'nightly (current year only) or full (incl. 2024/2025 backfills)'
        type: choice
        options: [full, nightly]
        default: full
  schedule:
    # Nightly Mon–Sat at 08:15 UTC: current season only. New cuts post during
    # active tournament weeks, so the current year genuinely needs daily.
    - cron: '15 8 * * 1-6'
    # Weekly full pass Sunday at 08:15 UTC: also re-backfills 2024/2025, which
    # rarely change. Pulling these once a week instead of nightly cuts the
    # heavy Railway compute (esp. the 2024 paging loop) by ~6x.
    - cron: '15 8 * * 0'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sync production tournament data
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          # Mon–Sat schedule → nightly (current year only). The Sunday
          # schedule and any manual run default to full; a manual run can
          # force nightly via the workflow_dispatch input.
          SYNC_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || (github.event.schedule == '15 8 * * 1-6' && 'nightly' || 'full') }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "Missing APP_URL repository secret. Set it to the production Railway URL, for example https://tennis-terminal-production.up.railway.app"
            exit 1
          fi

          if [ -z "${ADMIN_SECRET:-}" ]; then
            echo "Missing ADMIN_SECRET repository secret. Set it to the same value as the ADMIN_SECRET environment variable on Railway."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import socket
          import time
          import urllib.error
          import urllib.request

          base_url = os.environ['APP_URL'].strip().rstrip('/')
          if not base_url.startswith(('http://', 'https://')):
              base_url = 'https://' + base_url

          def request_json(path: str, *, required: bool = True, timeout: int = 180, retries: int = 3):
              url = base_url + path
              last_error = None
              for attempt in range(1, retries + 1):
                  print(f'\nGET {url} (attempt {attempt}/{retries}, timeout={timeout}s)', flush=True)
                  req = urllib.request.Request(
                      url,
                      headers={
                          'Accept': 'application/json',
                          'User-Agent': 'TennisCutsDataSync/1.0',
                          'X-Admin-Secret': os.environ['ADMIN_SECRET'],
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as res:
                          body = res.read().decode('utf-8', errors='replace')
                          print(body[:5000], flush=True)
                          return json.loads(body)
                  except (socket.timeout, TimeoutError, urllib.error.URLError, ConnectionError) as exc:
                      last_error = exc
                      print(f'TRANSIENT ERROR (attempt {attempt}): {exc}', flush=True)
                      if attempt < retries:
                          backoff = 5 * attempt
                          print(f'Retrying in {backoff}s...', flush=True)
                          time.sleep(backoff)
                          continue
                  except Exception as exc:
                      last_error = exc
                      print(f'ERROR: {exc}', flush=True)
                      break
              if required:
                  raise RuntimeError(f'{url} failed after {retries} attempts: {last_error}')
              return {'ok': False, 'error': str(last_error)}

          # Ceiling on any single paged sweep, so an endpoint that only manages a
          # couple of items per call can never run the job into its 90-minute cap.
          HARD_MAX_PAGES = 400

          def run_paged(label: str, path_factory, *, required: bool = True, max_pages: int = 20,
                        timeout: int = 180, budget_s: float = 1500):
              """Page through an endpoint until it reports hasMore=false.

              Endpoints like /api/import-cutoffs are time-budgeted server-side (25s),
              so a page can return having processed far fewer items than `limit` asked
              for — in practice a handful, because a target with no published PDF probes
              7-8 candidate URLs before giving up. That makes a fixed page cap a moving
              target: every week of the season adds eligible editions, so the same sweep
              needs more pages, and a hardcoded cap eventually fails the job for no real
              reason (2026 outgrew max_pages=60 at 594 targets in July).

              So max_pages is only a floor. When the endpoint reports totalTargets we
              re-project the cap from the observed per-page rate, and bound the sweep by
              wall-clock time instead. Leftovers are not lost: these imports are
              incremental, and step 9's /api/run-all sweeps up any cuts still missing.
              """
              print(f'\n=== {label} ===', flush=True)
              offset = 0
              pages = 0
              cap = max_pages
              started = time.monotonic()
              while pages < cap:
                  elapsed = time.monotonic() - started
                  if elapsed > budget_s:
                      print(f'WARNING: {label} stopped after {pages} pages / {elapsed:.0f}s '
                            f'(budget {budget_s:.0f}s); the rest rolls into the next run', flush=True)
                      return {'ok': True, 'hasMore': False}
                  data = request_json(path_factory(offset), required=required, timeout=timeout)
                  pages += 1
                  if not data.get('hasMore'):
                      return data
                  next_offset = data.get('nextOffset')
                  if next_offset is None or next_offset == offset:
                      raise RuntimeError(f'{label} did not return a valid nextOffset')
                  offset = int(next_offset)
                  # Re-size the cap from real progress: at the rate we're actually
                  # advancing, how many pages does the reported backlog need? Keeps the
                  # sweep sized to the data rather than to a number guessed months ago.
                  total = data.get('totalTargets')
                  if isinstance(total, int) and offset > 0 and total > offset:
                      projected = (total * pages + offset - 1) // offset + 5
                      cap = max(cap, min(projected, HARD_MAX_PAGES))
                  time.sleep(2)
              print(f'WARNING: {label} hit its {cap}-page ceiling; the rest rolls into the next run', flush=True)
              return {'ok': True, 'hasMore': False}

          # Scope: 'nightly' (current year only) or 'full' (incl. 2024/2025
          # historical backfills). Set from the firing schedule / dispatch input.
          import datetime
          scope = os.environ.get('SYNC_SCOPE', 'full').strip().lower()
          current_year = datetime.date.today().year
          # Years to run the heavy cut-refill loops over. Nightly = current only;
          # full = historical + current. Historical years rarely change, so
          # pulling them once a week is plenty and saves most of the compute.
          cut_years = [current_year] if scope == 'nightly' else [2024, 2025, current_year]
          print(f'\n=== Data sync scope: {scope} (cut years: {cut_years}) ===', flush=True)

          # 1) Sync canonical hardcoded calendar rows.
          request_json('/api/import-calendars')

          # 2) Primary calendar source: atptour.com. Import the official
          # Challenger Calendar PDF first so newly announced 2026 rows do not
          # wait for JeffSackmann or completed-match data. Runs every night —
          # this is the cheap "new tournaments" discovery and must stay daily.
          request_json(f'/api/sync-official-calendar?year={current_year}', required=False)

          # 3) ATP result-archive discovery (older fallback). Keep around for
          # historical years where atptour.com hides the upcoming-calendar UI.
          run_paged(
              'ATP schedule/code discovery',
              lambda offset: f'/api/sync-atp-schedule?year=2026&type=all&limit=100&offset={offset}&importCuts=true',
              required=False,
              max_pages=10,
          )

          # 4) JeffSackmann backfill (fallback for completed tournaments where
          # we still want the cut PDFs but the atptour.com page no longer
          # lists them). Idempotent and deliberately second-priority.
          # Historical years only run in the weekly full pass.
          for year in cut_years:
              run_paged(
                  f'Challenger season import {year}',
                  lambda offset, y=year: f'/api/import-challenger-season?year={y}&limit=50&offset={offset}',
                  required=False,
                  max_pages=30,
              )

          # 5) Re-assert canonical calendar dates. JeffSackmann's importer in
          # step 4 can overwrite week/start_date for tournaments that appear in
          # both ALL_EDITIONS and the JeffSackmann feed (e.g. Oeiras 4 getting
          # an April date instead of the correct May date). Running
          # import-calendars again here ensures the hardcoded catalogue wins.
          request_json('/api/import-calendars')

          # 5b) Merge tournaments that share a ProTennisLive code, then collapse
          # any remaining duplicate Challenger-level rows. JeffSackmann's
          # importer used to create "burnie-ch-burnie-ch" alongside "burnie";
          # this folds them back into one row.
          request_json('/api/dedupe-by-code?apply=true', required=False)
          request_json('/api/merge-official-challenger-levels?apply=true', required=False)

          # 6) Wipe rows where the PDF parser misread scores / prize money /
          # tournament titles as last_direct_acceptance. Safe daily: only
          # touches rows that match the garbage heuristics.
          request_json('/api/cleanup-bad-cuts?apply=true', required=False)

          # 6a) Remove cuts that were stored against the wrong edition. The
          # old run-all tried neighbour-year PDF URLs as fallbacks and would
          # accept last year's data for this year's edition. Idempotent: if
          # no mismatches exist, this is a no-op.
          request_json('/api/cleanup-mismatched-cuts?apply=true', required=False)

          # NOTE: the ITF World Tennis Tour calendar is imported by the
          # dedicated itf-sync.yml workflow. itftennis.com's bot protection
          # blocks Railway's IPs, so the fetch must happen on a GitHub runner.

          # 7) ATP-level cutoff refill. Page through so each request is bounded;
          # one giant call would happily blow the 180s timeout. Nightly does
          # current year only; the weekly full pass adds 2024/2025 (2024 alone
          # is ~870 targets / up to 200 pages — the bulk of the compute we're
          # moving off the nightly run).
          # This phase dominates the job: at ~33s per page the current year alone
          # ran 33 minutes in July 2026. Give the whole phase one deadline so a
          # Sunday full pass can't stack three years' sweeps into the 90-minute
          # job timeout. Historical years are mostly imported already, so their
          # pages advance near the full limit and they finish in a few minutes;
          # they're capped low and the current year inherits whatever is left.
          CUTOFF_PHASE_BUDGET_S = 3300
          HISTORICAL_YEAR_BUDGET_S = 420
          cutoff_deadline = time.monotonic() + CUTOFF_PHASE_BUDGET_S
          for year in cut_years:
              remaining = cutoff_deadline - time.monotonic()
              if remaining <= 30:
                  print(f'WARNING: skipping ATP cutoff refill {year}; the '
                        f'{CUTOFF_PHASE_BUDGET_S}s phase budget is spent', flush=True)
                  continue
              year_budget = remaining if year == current_year else min(HISTORICAL_YEAR_BUDGET_S, remaining)
              run_paged(
                  f'ATP cutoff refill {year}',
                  lambda offset, y=year: f'/api/import-cutoffs?year={y}&limit=40&offset={offset}',
                  required=(year == current_year),
                  max_pages=200 if year == 2024 else 60,
                  budget_s=year_budget,
              )

          # 8) Restore any historical rows that were previously hidden by stale cleanup.
          request_json('/api/restore-historical-status')

          # 9) Fill any remaining missing cuts. /api/run-all has its own 22s server-side budget,
          # so call it repeatedly until it reports completion. Tombstones make each call
          # process new editions instead of re-grinding the dead ones.
          print('\n=== Missing cut refill ===', flush=True)
          for attempt in range(60):
              data = request_json('/api/run-all', timeout=60)
              if not data.get('hasMore'):
                  print('run-all complete', flush=True)
                  break
              print(f'run-all has more work; attempt {attempt + 1}/60', flush=True)
              time.sleep(3)
          else:
              raise RuntimeError('run-all still had more work after 60 attempts')

          request_json('/api/restore-historical-status')

          # 10) Beta cut projections: after the night's calendar/cut imports,
          # refresh the production prediction snapshots and score any stored
          # predictions whose actual cuts landed during this sync. Keep this in
          # the main sync too (not only cut-predictions.yml / official-calendar-
          # sync) so every data refresh feeds the beta cuts shown on swings.
          print('\n=== Cut projections (beta) ===', flush=True)
          pred = request_json('/api/predict-cuts?apply=true&weeksAhead=8', required=False, timeout=280, retries=2)
          print(f"projections: written={pred.get('written')} scored={pred.get('scored')} "
                f"upcoming={pred.get('upcomingEditions')} noModel={pred.get('skippedNoModel')}", flush=True)

          # 11) Autonomous-discovery health gate. If the official Challenger
          # calendar PDF or the ITF feed has gone stale (scraper broke, ATP
          # changed their CDN, etc.), discovery silently imports nothing and the
          # data quietly rots. Fail the job so GitHub emails the owner instead
          # of leaving a broken pipeline green.
          print('\n=== Discovery health check ===', flush=True)
          health = request_json('/api/discovery-health', required=False)
          if not health.get('healthy', False):
              problems = health.get('problems') or ['discovery-health did not report healthy']
              print('DISCOVERY UNHEALTHY:', flush=True)
              for p in problems:
                  print(f'  - {p}', flush=True)
              raise RuntimeError('Autonomous discovery is unhealthy: ' + ' | '.join(problems))
          print('Discovery healthy.', flush=True)

          print('\nData sync complete.', flush=True)
          PY
