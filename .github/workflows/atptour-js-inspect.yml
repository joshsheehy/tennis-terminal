name: ATP frontend bundle inspect

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atptour-js-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch ATP static JS directly and inspect gateway calls
        run: |
          python3 - <<'PY'
          import re, urllib.error, urllib.request

          urls=[
            'https://www.atptour.com/assets/atptour/js/atptour.min.js?bust=639053157437868807',
            'https://www.atptour.com/assets/atptour/js/atptour.min.js',
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/javascript,text/javascript,*/*','Referer':'https://www.atptour.com/'}
          for url in urls:
            print('\nURL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                body=r.read(15_000_000)
                print('STATUS',r.status,'CTYPE',r.headers.get('content-type'),'BYTES',len(body),flush=True)
            except urllib.error.HTTPError as e:
              body=e.read(5000); print('STATUS',e.code,'CTYPE',e.headers.get('content-type'),'BYTES',len(body),'PREFIX',body[:150],flush=True); continue
            except Exception as e:
              print('ERROR',type(e).__name__,str(e),flush=True); continue
            js=body.decode('utf-8','replace'); low=js.lower()
            needles=['gateway-host-name','api/v2/gateway','playerlist','participant','acceptance','entrycode','alternate','scores.resultsarchive','draws','tournamentdetails','tournament-details']
            for needle in needles:
              poss=[m.start() for m in re.finditer(re.escape(needle),low)]
              print('NEEDLE',needle,'COUNT',len(poss),flush=True)
              for pos in poss[:20]:
                print(' ',re.sub(r'\s+',' ',js[max(0,pos-700):pos+1300])[:2000],flush=True)
          PY
