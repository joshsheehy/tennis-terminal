name: ATP frontend bundle inspect

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atptour-js-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch ATP static JS and map tournament endpoint hooks
        run: |
          python3 - <<'PY'
          import re, urllib.request

          url='https://www.atptour.com/assets/atptour/js/atptour.min.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/javascript,*/*','Referer':'https://www.atptour.com/'})
          with urllib.request.urlopen(req,timeout=30) as r:
            body=r.read(15_000_000)
          js=body.decode('utf-8','replace'); low=js.lower()
          print('STATUS 200 BYTES',len(body),flush=True)

          hooks=[]
          for m in re.finditer(r'["\']([^"\']*(?:endpoint|apiurl|api-url)[^"\']*)["\']',js,re.I):
            value=m.group(1)
            if len(value) < 140:
              hooks.append(value)
          print('\nUNIQUE ENDPOINT HOOK STRINGS',len(set(hooks)),flush=True)
          for value in sorted(set(hooks),key=str.lower): print(value,flush=True)

          selectors=[
            '.atp_tournament-details','.atp_whois-playing','.atp_tournament-profile-header',
            '.atp_scores-top-seeds','.atp_scores-draws','.atp_challenger-results',
            '.atp_tournament-profile','.atp_tournament',
          ]
          for selector in selectors:
            positions=[m.start() for m in re.finditer(re.escape(selector),js,re.I)]
            print('\nSELECTOR',selector,'COUNT',len(positions),flush=True)
            for pos in positions[:8]:
              snippet=re.sub(r'\s+',' ',js[max(0,pos-1400):pos+4200])
              print(snippet[:5600],flush=True)

          terms=['whoisplaying','topseeds','playerslist','eventyear','eventid','entrycode','rankroll','acceptancelist','original cut off']
          for term in terms:
            positions=[m.start() for m in re.finditer(re.escape(term),low)]
            print('\nTERM',term,'COUNT',len(positions),flush=True)
            for pos in positions[:12]:
              print(re.sub(r'\s+',' ',js[max(0,pos-700):pos+1500])[:2200],flush=True)
          PY
