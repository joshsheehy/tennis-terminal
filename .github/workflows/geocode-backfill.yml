name: Geocode backfill (Swings)

# Pages through /api/geocode-tournaments on the deployed app until every
# targeted tournament has coordinates, so nobody has to click the admin URL
# repeatedly. Uses the same APP_URL + ADMIN_SECRET repository secrets as
# data-sync.yml.
#
# NOTE: GitHub only lists manually-dispatchable workflows that exist on the
# default branch, so the "Run workflow" button appears after this file lands
# on main. Until then, run the equivalent curl loop documented in
# src/app/api/geocode-tournaments/route.ts or trigger via the API.

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Season to backfill (2024, 2025, 2026, or all)'
        required: false
        default: '2026'
      dry_run:
        description: 'true = preview only, false = write coordinates'
        required: false
        default: 'false'
      app_url:
        description: 'Override target deployment URL (defaults to the APP_URL secret)'
        required: false
        default: ''

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Backfill tournament coordinates
        env:
          APP_URL: ${{ inputs.app_url != '' && inputs.app_url || secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          YEAR: ${{ inputs.year }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "Missing APP_URL (repository secret or app_url input)."
            exit 1
          fi
          if [ -z "${ADMIN_SECRET:-}" ]; then
            echo "Missing ADMIN_SECRET repository secret."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base_url = os.environ['APP_URL'].strip().rstrip('/')
          if not base_url.startswith(('http://', 'https://')):
              base_url = 'https://' + base_url

          year = os.environ.get('YEAR', '2026').strip() or '2026'
          dry_run = os.environ.get('DRY_RUN', 'false').strip().lower() != 'false'

          all_failures = []
          total_written = 0

          # Each page handles up to 100 tournaments; distinct cities cost
          # ~1.1s each (Nominatim rate limit), reused cities are free.
          for page in range(1, 101):
              url = (
                  f'{base_url}/api/geocode-tournaments'
                  f'?year={year}&limit=100&dryRun={"true" if dry_run else "false"}'
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/json',
                      'User-Agent': 'TennisCutsGeocodeBackfill/1.0',
                      'X-Admin-Secret': os.environ['ADMIN_SECRET'],
                  },
              )
              print(f'\n=== page {page}: GET {url} ===', flush=True)
              with urllib.request.urlopen(req, timeout=300) as res:
                  data = json.loads(res.read().decode('utf-8', errors='replace'))

              if not data.get('ok'):
                  raise RuntimeError(f'Backfill page failed: {data}')

              summary = {k: data[k] for k in (
                  'dryRun', 'years', 'missingBeforeRun', 'processed',
                  'resolvedCount', 'failedCount', 'written', 'remaining',
                  'nominatimRequests',
              ) if k in data}
              print(json.dumps(summary, indent=2), flush=True)

              all_failures.extend(data.get('failures', []))
              total_written += int(data.get('written', 0))

              remaining = int(data.get('remaining', 0))
              processed = int(data.get('processed', 0))
              if remaining <= 0 or processed == 0:
                  break
              if dry_run:
                  # Dry runs never shrink `remaining`; one page is the preview.
                  break
              if int(data.get('written', 0)) == 0:
                  # A page that processed rows but wrote nothing means every
                  # remaining tournament is a permanent geocode failure —
                  # repeating the page would just re-ask Nominatim the same
                  # unanswerable questions.
                  print('no progress on this page; stopping (see failures below)', flush=True)
                  break
              time.sleep(2)
          else:
              raise RuntimeError('Backfill still had work after 100 pages')

          print(f'\nDone. mode={"dry-run" if dry_run else "apply"} '
                f'year={year} written={total_written} failures={len(all_failures)}', flush=True)
          if all_failures:
              print('\nFailed to geocode (resolve manually, never guessed):', flush=True)
              print(json.dumps(all_failures, indent=2), flush=True)
          PY
