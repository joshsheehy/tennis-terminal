name: Case ledger report

# Read-only dump of the audit→boss case ledger (see PLAYBOOK.md), for when you
# want what the boss would have told you on Telegram without waiting for the
# next escalation. Prints JSON to the log; makes no writes.

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Comma-separated statuses to include'
        required: false
        default: 'open,escalated,in_progress'
      limit:
        description: 'Max cases to return'
        required: false
        default: '100'
      search:
        description: 'Optional: also search tournaments by slug/name/city (debug-tournament)'
        required: false
      verifySync:
        description: 'Also re-run sync-official-calendar (verifies the source_url guard holds)'
        required: false
        default: 'false'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch case ledger + discovery health
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          STATUS: ${{ inputs.status || 'open,escalated,in_progress' }}
          LIMIT: ${{ inputs.limit || '100' }}
          SEARCH: ${{ inputs.search || '' }}
          VERIFY_SYNC: ${{ inputs.verifySync || 'false' }}
        run: |
          set -euo pipefail
          base="${APP_URL%/}"
          [[ "$base" == http* ]] || base="https://$base"

          echo "=== agent_cases (status=$STATUS) ==="
          curl --fail-with-body -sS --max-time 60 \
            -H "Accept: application/json" -H "X-Admin-Secret: $ADMIN_SECRET" \
            "$base/api/agent-cases?status=$STATUS&limit=$LIMIT" | jq .

          echo
          echo "=== discovery-health ==="
          curl -sS --max-time 60 \
            -H "Accept: application/json" -H "X-Admin-Secret: $ADMIN_SECRET" \
            "$base/api/discovery-health" | jq .

          echo
          echo "=== dedupe-by-code (dry run) ==="
          curl -sS --max-time 60 \
            -H "Accept: application/json" -H "X-Admin-Secret: $ADMIN_SECRET" \
            "$base/api/dedupe-by-code" | jq .

          echo
          echo "=== merge-official-challenger-levels (dry run) ==="
          curl -sS --max-time 60 \
            -H "Accept: application/json" -H "X-Admin-Secret: $ADMIN_SECRET" \
            "$base/api/merge-official-challenger-levels" | jq .

          if [ "${VERIFY_SYNC:-false}" = "true" ]; then
            echo
            echo "=== sync-official-calendar (verification re-run) ==="
            curl -sS --max-time 180 \
              -H "Accept: application/json" -H "X-Admin-Secret: $ADMIN_SECRET" \
              "$base/api/sync-official-calendar?year=2026" | head -c 2000
            echo
          fi

          if [ -n "$SEARCH" ]; then
            echo
            echo "=== debug-tournament (q=$SEARCH) ==="
            # New route; Railway may still be deploying it, so retry briefly.
            for attempt in 1 2 3 4 5; do
              resp=$(curl -sS --max-time 30 \
                -H "Accept: application/json" -H "X-Admin-Secret: $ADMIN_SECRET" \
                "$base/api/debug-tournament?q=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$SEARCH")")
              if echo "$resp" | jq -e '.ok' >/dev/null 2>&1; then
                echo "$resp" | jq .
                break
              fi
              echo "attempt $attempt: not ready yet, retrying in 10s"
              sleep 10
            done
          fi
