name: ATP app bundle recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atp-app-bundle-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public ATP app HTML and scripts
        run: |
          python3 - <<'PY'
          import gzip, io, json, re, urllib.error, urllib.parse, urllib.request

          ORIGIN='https://app.atptour.com'
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/javascript,text/javascript,*/*',
            'Accept-Language':'en-US,en;q=0.9',
            'Referer':'https://app.atptour.com/',
          }
          def get(url, timeout=20, cap=8_000_000):
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:
                body=r.read(cap)
                if r.headers.get('content-encoding')=='gzip':
                  try: body=gzip.GzipFile(fileobj=io.BytesIO(body)).read(cap)
                  except: pass
                return r.status,r.geturl(),r.headers,body
            except urllib.error.HTTPError as e:
              return e.code,url,e.headers,e.read(3000)
            except Exception as e:
              return None,url,{},str(e).encode()

          st,final,h,b=get(ORIGIN+'/')
          html=b.decode('utf-8','replace')
          print('ROOT',st,'FINAL',final,'CTYPE',h.get('content-type') if hasattr(h,'get') else None,'BYTES',len(b),flush=True)
          print('ROOT_PREFIX',re.sub(r'\s+',' ',html[:500]),flush=True)
          scripts=[]
          for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
            u=urllib.parse.urljoin(final,x)
            if urllib.parse.urlparse(u).netloc.endswith('atptour.com'):
              scripts.append(u)
          # Also collect modulepreload / JS assets.
          for x in re.findall(r'(?:href|src)=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',html,re.I):
            u=urllib.parse.urljoin(final,x)
            if urllib.parse.urlparse(u).netloc.endswith('atptour.com'):
              scripts.append(u)
          scripts=list(dict.fromkeys(scripts))
          print('SCRIPTS',len(scripts),flush=True)
          for u in scripts[:80]: print(' SCRIPT',u,flush=True)

          needles=[
            'playerlisttype','tournamentplayerlist','playerlist','entrycode','alternate','acceptance',
            'alternates','entry list','entrylist','participant','qualifying','rankroll','maindraw',
            'api/gateway','api/v2/gateway','gateway/','resultsarchive','livematches','tournamentid',
          ]
          endpoint_re=re.compile(r'https?://[^"\'`\s\\]+|/api/(?:v\d+/)?gateway/[A-Za-z0-9_./?=&${}:,-]+|/api/gateway/[A-Za-z0-9_./?=&${}:,-]+',re.I)
          total=0
          for u in scripts[:100]:
            st,fin,h,b=get(u,20)
            if st!=200: continue
            total+=len(b)
            js=b.decode('utf-8','replace')
            low=js.lower()
            found=[n for n in needles if n in low]
            if not found: continue
            print('\nBUNDLE',fin,'BYTES',len(b),'FOUND',found,flush=True)
            # Print nearby snippets for the high-value strings only.
            for n in found:
              positions=[m.start() for m in re.finditer(re.escape(n),low)][:8]
              for pos in positions:
                snip=re.sub(r'\s+',' ',js[max(0,pos-500):pos+1100])
                print(' SNIP',n,snip[:1600],flush=True)
            eps=[]
            for m in endpoint_re.finditer(js):
              val=m.group(0)
              if any(k in val.lower() for k in ['gateway','player','tournament','entry','draw','participant','accept','alternate']):
                eps.append(val[:500])
            for ep in list(dict.fromkeys(eps))[:100]: print(' ENDPOINT',ep,flush=True)
          print('\nTOTAL_SCRIPT_BYTES',total,flush=True)
          PY
