name: Agent ops (checked code attach + cut import)

# The two writes the daily cloud routine ("TennisCuts daily PTL code sweep") is allowed to make, each
# wrapped in the checks a person would do by hand. The routine has no ADMIN_SECRET; this workflow holds
# it and refuses anything that does not check out. Nothing else is reachable through here.
#
#   attach-code    Put a ProTennisLive code on ONE existing edition (slug + year), then pull its cuts.
#                  Refused unless (1) the posting exists and is a real sheet, (2) its header names the
#                  city hint, the edition's month and the year (codes get reused, so a number alone
#                  proves nothing), and (3) no other tournament already holds the code that season.
#                  apply=false (default) runs every check and writes nothing.
#                  The city hint must also be part of the slug (so a generic word cannot pass).
#   import-cutoffs Re-run the deterministic sheet importer for one slug + year. Idempotent.
#   lookup         Read-only: list the stored editions matching a word (`slug` is the word). The routine
#                  uses this to confirm a write instead of admin-get, which can write with apply=true.
#
#   gh workflow run agent-ops.yml -f op=attach-code -f slug=lima -f year=2026 -f code=6579 -f city_hint=Lima -f apply=true
#
# It never sets a cut VALUE (set-cut) and never merges or hides anything: those are judgment calls.

on:
  workflow_dispatch:
    inputs:
      op:
        description: 'attach-code or import-cutoffs'
        required: true
      slug:
        description: 'Existing tournament slug'
        required: true
      year:
        description: 'Season year, e.g. 2026'
        required: true
      code:
        description: 'PTL code (attach-code only)'
        required: false
      city_hint:
        description: 'A word that must appear in the posting header, e.g. the city (attach-code only)'
        required: false
      apply:
        description: 'true to write (attach-code only; default is a checked dry run)'
        required: false
        default: 'false'

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the op
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OP: ${{ inputs.op }}
          SLUG: ${{ inputs.slug }}
          YEAR: ${{ inputs.year }}
          CODE: ${{ inputs.code }}
          CITY_HINT: ${{ inputs.city_hint }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || fail "bad slug"
          [[ "$YEAR" =~ ^20[0-9]{2}$ ]] || fail "bad year"
          base="${APP_URL%/}"; [[ "$base" == http* ]] || base="https://$base"
          get() { curl --fail-with-body -sS --max-time 120 -H "X-Admin-Secret: $ADMIN_SECRET" -H 'Accept: application/json' "$base$1"; }

          if [ "$OP" = "lookup" ]; then
            # Read-only: the one lookup the routine needs to confirm a write. `slug` is the search word.
            get "/api/debug-tournament?q=$SLUG" | jq '[.rows[]? | {slug, year, week, start_date, status, source_url}]'
            exit 0
          fi

          if [ "$OP" = "import-cutoffs" ]; then
            get "/api/import-cutoffs?year=$YEAR&slug=$SLUG&limit=10" | jq '{ok, importedWithCutsCount, importedNullCutsCount, importedWithCuts: [.importedWithCuts[]? | select(.slug=="'"$SLUG"'") | {pdf_url, last_direct_acceptance_rank, challenger_doubles_advanced_cut_rank, challenger_doubles_onsite_cut_rank}], importedNullCuts: [.importedNullCuts[]? | select(.slug=="'"$SLUG"'")]}'
            exit 0
          fi

          [ "$OP" = "attach-code" ] || fail "op must be attach-code or import-cutoffs"
          [[ "$CODE" =~ ^[0-9]{2,5}$ ]] || fail "bad code"
          [[ "$CITY_HINT" =~ ^[A-Za-z][A-Za-z\ \'-]{1,40}$ ]] || fail "city_hint is required (letters only): a word the posting header must contain"

          # The hint is chosen by the caller, so tie it to the slug: a generic word ("Open", "Tennis",
          # "Challenger") would otherwise pass the header check on any sheet.
          hint_norm=$(printf '%s' "$CITY_HINT" | tr '[:upper:]' '[:lower:]' | tr -s ' -' ' ')
          slug_norm=$(printf '%s' "$SLUG" | tr '-' ' ')
          [ "${#hint_norm}" -ge 3 ] || fail "city_hint is too short"
          case " $slug_norm " in *" $hint_norm "*|*" $hint_norm"*) ;; *) fail "city_hint \"$CITY_HINT\" is not part of the slug \"$SLUG\": not attaching" ;; esac

          echo "=== 1. The posting must exist and be a real sheet ==="
          mkdir -p "$RUNNER_TEMP/p"; pdf="$RUNNER_TEMP/p/sheet.pdf"; got=""
          for f in ds mds qs mdd; do
            size=$(curl -sS -A 'Mozilla/5.0 (compatible; TennisCutsBot/1.0)' --max-time 40 -o "$pdf" -w '%{size_download}' "https://www.protennislive.com/posting/$YEAR/$CODE/$f.pdf" || echo 0)
            code_http=$(head -c 4 "$pdf" 2>/dev/null | tr -d '\0')
            if [ "${size:-0}" -gt 20000 ] && [ "$code_http" = "%PDF" ]; then got="$f"; break; fi
          done
          [ -n "$got" ] || fail "no real sheet at posting/$YEAR/$CODE (nothing posted yet, or the code does not exist): not attaching"
          echo "found $got.pdf ($size bytes)"

          echo "=== 2. Its header must name this place, month and year ==="
          command -v pdftotext >/dev/null || sudo apt-get install -y -qq poppler-utils >/dev/null
          head_text=$(pdftotext -layout -l 1 "$pdf" - | head -25)
          echo "$head_text" | head -8
          dry=$(get "/api/set-edition-code?slug=$SLUG&year=$YEAR&code=$CODE")
          echo "$dry" | jq .
          start=$(echo "$dry" | jq -r '.startDate // empty'); [ -n "$start" ] || fail "no $YEAR edition for $SLUG"
          month=$(date -u -d "$start" +%B)
          # Compare without accents or case; the sheet prints "07 - 13 DECEMBER 2026" or "9 November — 15 November 2026".
          norm() { iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null | tr '[:upper:]' '[:lower:]'; }
          ht=$(echo "$head_text" | norm)
          echo "$ht" | grep -qF "$(echo "$CITY_HINT" | norm)" || fail "header does not contain \"$CITY_HINT\": wrong tournament, not attaching"
          echo "$ht" | grep -qF "$(echo "$month" | norm)" || fail "header does not contain the edition's month ($month $start): wrong event or a reused code, not attaching"
          echo "$ht" | grep -qF "$YEAR" || fail "header does not contain $YEAR: not attaching"

          echo "=== 3. No other tournament may hold this code this season ==="
          others=$(echo "$dry" | jq -r '.sameSeasonCodeOnOtherSlugs | length')
          [ "$others" = "0" ] || fail "code already used by another tournament this season: not attaching"

          echo "checks passed"
          if [ "$APPLY" != "true" ]; then echo "dry run only (apply=false); nothing written"; exit 0; fi
          get "/api/set-edition-code?slug=$SLUG&year=$YEAR&code=$CODE&apply=true" | jq '{ok, apply, slug, code, sourceUrl}'
          echo "=== Pulling its cuts ==="
          get "/api/import-cutoffs?year=$YEAR&slug=$SLUG&limit=10" | jq '{ok, importedWithCuts: [.importedWithCuts[]? | select(.slug=="'"$SLUG"'") | {pdf_url, last_direct_acceptance_rank}]}'
