name: Beta cuts tracking report (one-off)

# Temporary push-triggered twin of cut-predictions.yml (workflow_dispatch is
# not available to the current automation token). Runs the score pass first so
# the tracking report reflects every cut that has landed, then prints the
# report and the walk-forward backtest. Delete after use.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/beta-report-once.yml']

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Score, report, backtest
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ['APP_URL'].strip().rstrip('/')
          if not base.startswith(('http://', 'https://')):
              base = 'https://' + base
          secret = os.environ['ADMIN_SECRET']

          def get(path, timeout=280):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      'Accept': 'application/json',
                      'User-Agent': 'TennisCutsPredictions/1.0',
                      'X-Admin-Secret': secret,
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as res:
                  return json.loads(res.read().decode('utf-8', errors='replace'))

          print('=== Score pass (predict-cuts apply) ===', flush=True)
          out = get('/api/predict-cuts?apply=true&weeksAhead=8')
          print(f"ok={out.get('ok')} written={out.get('written')} scored={out.get('scored')} "
                f"skippedNoModel={out.get('skippedNoModel')} model={out.get('modelVersion')}", flush=True)

          print('\n=== Live tracking: stored predictions vs actual cuts ===', flush=True)
          rep = get('/api/cut-prediction-report?rows=all')
          if not rep.get('ok'):
              raise RuntimeError(f'report failed: {json.dumps(rep)[:400]}')
          print(f"scored: {rep.get('scored')} | pending: {rep.get('pending')}", flush=True)
          print(f"overall: {json.dumps(rep.get('overall'))}", flush=True)
          for name in ('byDraw', 'byHorizon', 'byMethod', 'byVersion', 'byTier'):
              print(f"\n{name}:", flush=True)
              for k, v in (rep.get(name) or {}).items():
                  print(f"  {k}: {json.dumps(v)}", flush=True)
          print('\nworst misses:', flush=True)
          for r in rep.get('worstMisses') or []:
              print(f"  {json.dumps(r)}", flush=True)
          print('\nall scored rows:', flush=True)
          for r in rep.get('rows') or []:
              print(f"  {json.dumps(r)}", flush=True)

          print('\n=== Walk-forward backtest (tuned) ===', flush=True)
          bt = get('/api/backtest-cuts?tune=true')
          for draw, r in (bt.get('report') or {}).items():
              o = r.get('overall') or {}
              print(f"{r.get('label')}: n={o.get('n')} model {o.get('modelMAE')} vs baseline {o.get('baselineMAE')} "
                    f"| win {o.get('winRate')} | p50/p75/p90 {o.get('relAbsErrP50')}/{o.get('relAbsErrP75')}/{o.get('relAbsErrP90')}", flush=True)
              for group, g in (r.get('byGroup') or {}).items():
                  print(f"  {group:<11} n={g.get('n'):>4} model {g.get('modelMAE')} vs baseline {g.get('baselineMAE')} "
                        f"| win {g.get('winRate')} | tuned {g.get('bestBetas')} -> {g.get('bestMAE')}", flush=True)
              for year, g in (r.get('byYear') or {}).items():
                  print(f"  {year}: n={g.get('n')} model {g.get('modelMAE')} vs baseline {g.get('baselineMAE')}", flush=True)
          PY
