name: CI

on:
  push:
  pull_request:

# Rapid consecutive pushes previously ran (and could fail + email) once per
# push. Cancel the superseded run so only the newest commit reports.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The pg Pool needs a URL at module-import time during next build,
      # but no connection is ever opened (all pages are force-dynamic).
      DATABASE_URL: postgresql://postgres:devpassword@localhost:5432/tennis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: tennis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:devpassword@localhost:5432/tennis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema, migrations, seed
        run: |
          for f in sql/schema.sql \
                   sql/002_add_alternate_entries_count.sql \
                   sql/003_allow_not_held_editions.sql \
                   sql/004_add_lucky_loser_count.sql \
                   sql/006_add_tournament_coordinates.sql \
                   sql/007_create_swings.sql \
                   sql/008_add_swing_level_scope.sql \
                   sql/009_add_swing_kind.sql \
                   sql/010_add_itf_qualifying_byes.sql \
                   sql/013_create_acceptance_lists.sql \
                   scripts/seed-dev-db.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
