name: Calendar diagnosis (week 9)

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season year to analyze
        default: '2026'
        required: true
      run_sync:
        description: Re-run /api/sync-official-calendar against production after analysis
        type: boolean
        default: false
  # The session's GitHub token cannot dispatch workflows, so pushes touching
  # these paths also trigger a run. Committing a .diag/run-sync file enables
  # the production sync step for push-triggered runs.
  push:
    paths:
      - '.github/workflows/calendar-diagnosis.yml'
      - 'scripts/diagnose-calendar-pdf.mjs'
      - '.diag/**'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YEAR: ${{ inputs.year || '2025' }}
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Production DB state via API (waits for Railway deploy)
        run: |
          for i in $(seq 1 16); do
            body=$(curl -sS --max-time 30 "$APP_URL/api/debug-week?year=$YEAR&from=$YEAR-02-16&to=$YEAR-03-15" \
              -H "X-Admin-Secret: $ADMIN_SECRET" -H "Accept: application/json" || true)
            if printf '%s' "$body" | head -c 200 | grep -q '"ok":true'; then
              printf '%s' "$body" | python3 -m json.tool
              exit 0
            fi
            echo "attempt $i: debug-week not ready (deploy in progress?): $(printf '%s' "$body" | head -c 120)"
            sleep 30
          done
          echo "debug-week endpoint never became available; continuing anyway"

      - name: Production DB state via psql (only if DATABASE_URL secret exists)
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret not set; skipping direct DB inspection."
            exit 0
          fi
          psql "$DATABASE_URL" -P pager=off -c "
            select te.week, te.start_date, te.status, te.level, t.slug, t.name, te.source,
                   (select count(*) from cutoff_snapshots cs where cs.tournament_edition_id = te.id) as cuts
            from tournament_editions te
            join tournaments t on t.id = te.tournament_id
            where te.year = ${YEAR}
              and te.start_date between '${YEAR}-02-16' and '${YEAR}-03-15'
            order by te.start_date, te.status, t.name;"
          psql "$DATABASE_URL" -P pager=off -c "
            select te.status, count(*)
            from tournament_editions te
            where te.year = ${YEAR}
              and te.start_date between '${YEAR}-03-02' and '${YEAR}-03-08'
            group by te.status;"

      - name: Download official challenger PDF, replay parser, audit vs production
        # Single download/parse per run: later steps reuse the emitted rows
        # (repeat PDF probing from one runner IP gets throttled by atptour).
        run: node scripts/diagnose-calendar-pdf.mjs "$YEAR" --verify --emit-rows /tmp/official-rows.json

      - name: Restore week 9 and verify the fixed sweep keeps it visible
        run: |
          for i in $(seq 1 12); do
            curl -sS --max-time 120 "$APP_URL/api/restore-historical-status" -H "X-Admin-Secret: $ADMIN_SECRET" > /dev/null || true
            curl -sS --max-time 180 "$APP_URL/api/import-calendars" -H "X-Admin-Secret: $ADMIN_SECRET" > /dev/null || true
            body=$(curl -sS --max-time 30 "$APP_URL/api/debug-week?year=$YEAR&from=$YEAR-03-02&to=$YEAR-03-08" -H "X-Admin-Secret: $ADMIN_SECRET" || true)
            hidden=$(printf '%s' "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for e in d['editions'] if e['status'] != 'held' and e['cuts'] > 0))" 2>/dev/null || echo 99)
            echo "attempt $i: hidden cut-bearing editions in early-March window: $hidden"
            if [ "$hidden" = "0" ]; then
              printf '%s' "$body" | python3 -m json.tool
              echo "WEEK 9 RESTORED AND SWEEP-PROOF (import-calendars no longer hides it)"
              exit 0
            fi
            sleep 30
          done
          echo "week 9 still has hidden rows; leaving a final restore so the site stays correct"
          curl -sS --max-time 120 "$APP_URL/api/restore-historical-status" -H "X-Admin-Secret: $ADMIN_SECRET" | head -c 500
          exit 1

      - name: POST parsed rows to production
        if: ${{ inputs.run_sync || hashFiles('.diag/run-sync') != '' }}
        run: |
          test -s /tmp/official-rows.json || { echo "no rows were emitted by the parse step"; exit 1; }
          python3 - <<'PY'
          import json, os, time, urllib.request

          base = os.environ['APP_URL'].strip().rstrip('/')
          secret = os.environ['ADMIN_SECRET']
          payload = json.load(open('/tmp/official-rows.json'))
          rows = payload['rows']
          print(f"parsed {len(rows)} official rows for {payload['year']} from {payload['sourcePdfUrl']}")

          total_upserted = 0
          for start in range(0, len(rows), 100):
              chunk = {'year': payload['year'], 'sourcePdfUrl': payload['sourcePdfUrl'], 'rows': rows[start:start+100]}
              body = json.dumps(chunk).encode()
              for attempt in range(1, 6):
                  req = urllib.request.Request(
                      f'{base}/api/import-official-rows?apply=true',
                      data=body, method='POST',
                      headers={'Content-Type': 'application/json', 'X-Admin-Secret': secret, 'Accept': 'application/json'},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=180) as res:
                          out = json.loads(res.read())
                          print(f"chunk {start}-{start+len(chunk['rows'])}: ok={out['ok']} upserted={out['upsertedCount']} failed={out['failedCount']} invalid={out['invalidCount']}")
                          if not out['ok']:
                              print(json.dumps({'failed': out['failed'], 'invalid': out['invalid']}, indent=1))
                              raise SystemExit(1)
                          total_upserted += out['upsertedCount']
                          break
                  except SystemExit:
                      raise
                  except Exception as exc:
                      print(f'chunk {start} attempt {attempt} failed: {exc}')
                      if attempt == 5:
                          raise SystemExit(1)
                      time.sleep(20 * attempt)

          print(f'TOTAL UPSERTED: {total_upserted}')
          if total_upserted == 0:
              raise SystemExit(1)
          PY

      - name: Consolidate duplicates and restore statuses after sync
        if: ${{ inputs.run_sync || hashFiles('.diag/run-sync') != '' }}
        run: |
          # The duplicate merge groups by SQL deployed on Railway — wait until
          # production serves this commit before merging.
          for i in $(seq 1 20); do
            rev=$(curl -sS --max-time 20 "$APP_URL/api/debug-week?year=2026&from=2026-01-01&to=2026-01-02" \
              -H "X-Admin-Secret: $ADMIN_SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin).get('rev'))" 2>/dev/null || echo unknown)
            echo "deployed rev: $rev (want $GITHUB_SHA)"
            [ "$rev" = "$GITHUB_SHA" ] && break
            if [ "$rev" = "None" ] || [ "$rev" = "null" ]; then
              echo "RAILWAY_GIT_COMMIT_SHA not exposed; falling back to a fixed wait"
              sleep 240
              break
            fi
            sleep 20
          done
          # cleanup-duplicates intentionally has NO year filter: accent/paren
          # ghosts exist across 2024-2026.
          for path in \
            "/api/cleanup-duplicates?dryRun=false" \
            "/api/dedupe-by-code?apply=true" \
            "/api/merge-official-challenger-levels?apply=true" \
            "/api/restore-historical-status"; do
            echo "=== GET $path"
            curl -sS --max-time 280 "$APP_URL$path" -H "X-Admin-Secret: $ADMIN_SECRET" | head -c 1500
            echo
          done

      - name: Final audit of season vs official PDF
        if: ${{ inputs.run_sync || hashFiles('.diag/run-sync') != '' }}
        run: node scripts/diagnose-calendar-pdf.mjs "$YEAR" --verify-from /tmp/official-rows.json
