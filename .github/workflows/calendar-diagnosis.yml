name: Calendar diagnosis (week 9)

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season year to analyze
        default: '2026'
        required: true
      run_sync:
        description: Re-run /api/sync-official-calendar against production after analysis
        type: boolean
        default: false
  # The session's GitHub token cannot dispatch workflows, so pushes touching
  # these paths also trigger a run. Committing a .diag/run-sync file enables
  # the production sync step for push-triggered runs.
  push:
    paths:
      - '.github/workflows/calendar-diagnosis.yml'
      - 'scripts/diagnose-calendar-pdf.mjs'
      - '.diag/**'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YEAR: ${{ inputs.year || '2026' }}
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Production DB state via API (waits for Railway deploy)
        run: |
          for i in $(seq 1 16); do
            body=$(curl -sS --max-time 30 "$APP_URL/api/debug-week?year=$YEAR&from=$YEAR-02-16&to=$YEAR-03-15" \
              -H "X-Admin-Secret: $ADMIN_SECRET" -H "Accept: application/json" || true)
            if printf '%s' "$body" | head -c 200 | grep -q '"ok":true'; then
              printf '%s' "$body" | python3 -m json.tool
              exit 0
            fi
            echo "attempt $i: debug-week not ready (deploy in progress?): $(printf '%s' "$body" | head -c 120)"
            sleep 30
          done
          echo "debug-week endpoint never became available; continuing anyway"

      - name: Production DB state via psql (only if DATABASE_URL secret exists)
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret not set; skipping direct DB inspection."
            exit 0
          fi
          psql "$DATABASE_URL" -P pager=off -c "
            select te.week, te.start_date, te.status, te.level, t.slug, t.name, te.source,
                   (select count(*) from cutoff_snapshots cs where cs.tournament_edition_id = te.id) as cuts
            from tournament_editions te
            join tournaments t on t.id = te.tournament_id
            where te.year = ${YEAR}
              and te.start_date between '${YEAR}-02-16' and '${YEAR}-03-15'
            order by te.start_date, te.status, t.name;"
          psql "$DATABASE_URL" -P pager=off -c "
            select te.status, count(*)
            from tournament_editions te
            where te.year = ${YEAR}
              and te.start_date between '${YEAR}-03-02' and '${YEAR}-03-08'
            group by te.status;"

      - name: Download official challenger PDF and replay parser
        run: node scripts/diagnose-calendar-pdf.mjs "$YEAR"

      - name: Restore week 9 and verify the fixed sweep keeps it visible
        run: |
          for i in $(seq 1 12); do
            curl -sS --max-time 120 "$APP_URL/api/restore-historical-status" -H "X-Admin-Secret: $ADMIN_SECRET" > /dev/null || true
            curl -sS --max-time 180 "$APP_URL/api/import-calendars" -H "X-Admin-Secret: $ADMIN_SECRET" > /dev/null || true
            body=$(curl -sS --max-time 30 "$APP_URL/api/debug-week?year=$YEAR&from=$YEAR-03-02&to=$YEAR-03-08" -H "X-Admin-Secret: $ADMIN_SECRET" || true)
            hidden=$(printf '%s' "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for e in d['editions'] if e['status'] != 'held'))" 2>/dev/null || echo 99)
            echo "attempt $i: hidden editions in week 9 window: $hidden"
            if [ "$hidden" = "0" ]; then
              printf '%s' "$body" | python3 -m json.tool
              echo "WEEK 9 RESTORED AND SWEEP-PROOF (import-calendars no longer hides it)"
              exit 0
            fi
            sleep 30
          done
          echo "week 9 still has hidden rows; leaving a final restore so the site stays correct"
          curl -sS --max-time 120 "$APP_URL/api/restore-historical-status" -H "X-Admin-Secret: $ADMIN_SECRET" | head -c 500
          exit 1

      - name: Re-run official calendar sync on production (waits for pdfjs deploy)
        if: ${{ inputs.run_sync || hashFiles('.diag/run-sync') != '' }}
        run: |
          for i in $(seq 1 14); do
            out=$(curl -sS --max-time 300 "$APP_URL/api/sync-official-calendar?year=$YEAR" \
              -H "X-Admin-Secret: $ADMIN_SECRET" -H "Accept: application/json" || true)
            printf '%s' "$out" | head -c 1200; echo
            ok=$(printf '%s' "$out" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            srcs=[p.get('extractionSource') for p in d.get('pdfResults',[])]
            print('yes' if 'pdfjs' in srcs and d.get('upsertedCount',0) > 0 else 'no')
          except Exception:
            print('no')" || echo no)
            if [ "$ok" = "yes" ]; then
              echo "OFFICIAL SYNC SUCCEEDED VIA PDFJS"
              echo "--- post-sync week 9 state ---"
              curl -sS --max-time 30 "$APP_URL/api/debug-week?year=$YEAR&from=$YEAR-03-02&to=$YEAR-03-08" \
                -H "X-Admin-Secret: $ADMIN_SECRET" | python3 -m json.tool
              exit 0
            fi
            echo "attempt $i: pdfjs extraction not live yet (deploy in progress?)"
            sleep 30
          done
          echo "official sync never reported pdfjs extraction with upserts"
          exit 1
