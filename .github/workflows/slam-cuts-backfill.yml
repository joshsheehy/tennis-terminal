name: Slam cuts backfill

# Computes Grand Slam entry cuts from public structured data — Wikipedia's
# draw pages (every entrant marked WC/Q/LL/PR vs direct acceptance) crossed
# with Jeff Sackmann's weekly ATP ranking files at the entry deadline — and
# imports them via POST /api/import-slam-cuts. Fill-only: cuts already in the
# DB are never overwritten.
#
# This replaced a scraper of forum-mirrored entry lists: the sources behind
# bot walls (menstennisforums, wimbledon.com) defeat even a real browser on
# runners, while these two sources are open, structured, and verifiable.
#
# Run once with apply=false (default) to read every computed number with the
# evidence it came from, then again with apply=true to import the
# high-confidence rows. A row where any direct acceptance failed to match a
# ranked player is 'review' (the unmatched player could BE the cut) and is
# never imported automatically. Doubles isn't computable (no public doubles
# ranking history) — those stay with the hand-verified slam-cuts.ts path.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated seasons to compute'
        required: false
        default: '2022,2023,2024,2025,2026'
      draws:
        description: 'Draws: ms (singles main), qs (singles qualifying)'
        required: false
        default: 'ms,qs'
      apply:
        description: 'true = import high-confidence rows, false = report only'
        required: false
        default: 'false'

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute cuts from draws + deadline rankings
        env:
          YEARS: ${{ inputs.years }}
          DRAWS: ${{ inputs.draws }}
        run: |
          set -euo pipefail
          node scripts/compute-slam-cuts.mjs --years "$YEARS" --draws "$DRAWS" --emit /tmp/slam-cuts.json
          test -s /tmp/slam-cuts.json || { echo "compute emitted nothing"; exit 1; }

      - name: Import high-confidence rows
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          data = json.load(open('/tmp/slam-cuts.json'))
          found = data.get('found', [])
          gaps = data.get('gaps', [])
          high = [r for r in found if r.get('confidence') == 'high']
          review = [r for r in found if r.get('confidence') != 'high']
          apply = os.environ.get('APPLY', 'false').strip().lower() == 'true'

          print(f"computed: {len(found)} cuts ({len(high)} high-confidence, {len(review)} for review), {len(gaps)} gaps\n")
          for r in review:
              print(f"REVIEW  {r['slug']} {r['year']} {r['eventType']}/{r['drawType']} cut={r['cut']}")
              for e in r.get('evidence', []):
                  print(f"        {e}")
              print(f"        source: {r['source']}")
          for g in gaps:
              print(f"GAP     {g['label']}: {g['reason'][:160]}")

          if not high:
              print('\nNo high-confidence rows to import.')
              raise SystemExit(0)

          rows = [
              {
                  'slug': r['slug'], 'year': r['year'],
                  'eventType': r['eventType'], 'drawType': r['drawType'],
                  'cut': r['cut'], 'source': r['source'],
                  'note': ' | '.join(r.get('evidence', []))[:380],
              }
              for r in high
          ]
          base = os.environ['APP_URL'].strip().rstrip('/')
          if not base.startswith(('http://', 'https://')):
              base = 'https://' + base
          url = f"{base}/api/import-slam-cuts?apply={'true' if apply else 'false'}"
          req = urllib.request.Request(
              url,
              data=json.dumps({'rows': rows}).encode(),
              method='POST',
              headers={
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'TennisCutsSlamBackfill/2.0',
                  'X-Admin-Secret': os.environ['ADMIN_SECRET'],
              },
          )
          with urllib.request.urlopen(req, timeout=180) as res:
              out = json.loads(res.read().decode('utf-8', errors='replace'))
          mode = 'imported' if apply else 'WOULD import (dry run)'
          print(f"\n{mode}: written={out.get('written')} of {out.get('totalEntries')}")
          for r in out.get('results', []):
              print(f"  {r['action']:>10}  {r['slug']} {r['year']} {r['event']}/{r['draw']} = {r['cut']}"
                    + (f" (existing {r['existingCut']})" if r.get('existingCut') else ''))
          if not out.get('ok'):
              raise SystemExit(1)
          PY
