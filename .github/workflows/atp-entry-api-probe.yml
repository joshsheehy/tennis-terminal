name: ATP public entry API probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atp-entry-api-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official ATP feed schemas
        run: |
          python3 - <<'PY'
          import json
          import urllib.request, urllib.error

          def fetch_json(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; TennisCutsResearch/1.0)',
                  'Accept': 'application/json,*/*;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=20) as res:
                  return json.loads(res.read().decode('utf-8'))

          for client in ('orgclient', 'tournamentclient'):
              url = f'https://api.protennislive.com/feeds/swagger/{client}/swagger.json'
              print(f'\n=== SWAGGER {client} ===')
              try:
                  doc = fetch_json(url)
                  print('title/version:', doc.get('info'))
                  print('securitySchemes:', json.dumps(doc.get('components', {}).get('securitySchemes', {}), indent=2))
                  print('top-level security:', json.dumps(doc.get('security', []), indent=2))
                  player_path = doc.get('paths', {}).get('/PlayerList/{tournamentYear}/{tournamentId}')
                  print('PlayerList path:', json.dumps(player_path, indent=2)[:12000])
                  schemas = doc.get('components', {}).get('schemas', {})
                  for name in ('PlayerListItem', 'TournamentPlayerList', 'TournamentPlayerListItem'):
                      print(f'SCHEMA {name}:', json.dumps(schemas.get(name), indent=2)[:12000])
              except Exception as exc:
                  print('swagger error:', type(exc).__name__, str(exc))

          # Finite no-auth confirmation against current-week and next-week codes.
          for code in (8392, 3131, 8297, 9533, 3121, 600, 3123):
              url = f'https://api.protennislive.com/feeds/PlayerList/2026/{code}'
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; TennisCutsResearch/1.0)',
                  'Accept': 'application/json,*/*;q=0.8',
              })
              try:
                  with urllib.request.urlopen(req, timeout=10) as res:
                      body = res.read(1000)
                      print(f'PLAYERLIST {code}: {res.status} auth={res.headers.get("www-authenticate")} body={body[:300]!r}')
              except urllib.error.HTTPError as exc:
                  print(f'PLAYERLIST {code}: {exc.code} auth={exc.headers.get("www-authenticate")}')
              except Exception as exc:
                  print(f'PLAYERLIST {code}: ERROR {type(exc).__name__} {exc}')
          PY
