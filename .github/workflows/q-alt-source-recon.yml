name: Q alternate source recon
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/q-alt-source-recon.yml']
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact Week 33 qualifying PDFs slowly
        run: |
          mkdir -p research
          python3 -m pip install --quiet pypdf
          python3 - <<'PY' > research/ptl-week33-qs-status.txt
          import urllib.request, hashlib, io, datetime, time
          from pypdf import PdfReader

          EVENTS=[
            ('cancun',3009),
            ('quebec-city',3103),
            ('kingston',3121),
            ('prague',600),
            ('roehampton',3123),
            ('sion',3133),
          ]
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'application/pdf,*/*'}
          print('RUN_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat())
          for idx,(slug,tid) in enumerate(EVENTS):
            if idx: time.sleep(8)
            url=f'https://www.protennislive.com/posting/2026/{tid}/qs.pdf'
            try:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=15) as r:
                data=r.read(); status=r.status; ctype=r.headers.get('content-type','')
              sha=hashlib.sha256(data).hexdigest()[:16]
              placeholder=(len(data)==2616 and sha=='eaf906597d4921ed')
              print(f'\n===== {slug} ID={tid} STATUS={status} BYTES={len(data)} PLACEHOLDER={placeholder} TYPE={ctype} SHA={sha} URL={url} =====')
              if data.startswith(b'%PDF'):
                reader=PdfReader(io.BytesIO(data))
                text='\n'.join((p.extract_text() or '') for p in reader.pages[:2])
                print(text[:16000])
              else:
                print(data[:500].decode('utf-8','replace'))
            except Exception as e:
              print(f'\n===== {slug} ID={tid} ERR={e!r} URL={url} =====')
          PY
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ptl-week33-qs-status.txt
          git commit -m "Save Week 33 Q PDF status" || exit 0
          git push
