name: Q alternate source recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/q-alt-source-recon.yml'

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe and save public Q-list sources
        run: |
          mkdir -p research
          python3 - <<'PY' > research/q-alt-source-output.txt
          import re, urllib.request, urllib.parse, html, json, datetime
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'text/html,application/json,application/rss+xml,*/*'}
          EVENTS=['cancun','québec','quebec','kingston','roehampton','prague','praga','sion']
          TERMS=EVENTS+['qualifying','qualificazioni','alternates qualificazioni','alternates','out:','in:','next:','qualifying next-in','qualalt']
          def get(url):
            try:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:
                return str(r.status),r.geturl(),r.read().decode('utf-8','replace')
            except Exception as e:return 'ERR',str(e),''
          def clean(s):
            s=re.sub(r'<script.*?</script>',' ',s,flags=re.S|re.I)
            s=re.sub(r'<style.*?</style>',' ',s,flags=re.S|re.I)
            s=re.sub(r'<[^>]+>','\n',s)
            s=html.unescape(s)
            s=re.sub(r'[ \t]+',' ',s)
            return re.sub(r'\n\s*\n+','\n',s)
          def excerpts(t):
            low=t.lower(); ranges=[]
            for term in TERMS:
              for m in re.finditer(re.escape(term),low):
                a=max(0,m.start()-700); b=min(len(t),m.start()+2600)
                ranges.append((a,b,term))
            ranges.sort(); merged=[]
            for a,b,term in ranges:
              if merged and a<=merged[-1][1]+200:
                merged[-1]=(merged[-1][0],max(merged[-1][1],b),merged[-1][2]+'|'+term)
              else: merged.append((a,b,term))
            return merged[:80]
          print('RUN_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat())
          current='https://www.livetennis.it/post/469551/challenger-cancun-quebec-city-kingston-roehampton-praga-e-sion-la-situazione-aggiornata-darderi-si-cancella-da-cancun/'
          old='https://www.livetennis.it/post/446046/challenger-todi-cancun-barranquilla-sumter-sofia-1-e-hersonissos-3-la-situazione-aggiornata-md-e-qualificazioni/'
          urls=[
            ('LT_CURRENT',current),
            ('LT_CURRENT_REST','https://www.livetennis.it/wp-json/wp/v2/posts/469551?context=view'),
            ('LT_CURRENT_ROUTE','https://www.livetennis.it/?rest_route=/wp/v2/posts/469551'),
            ('LT_CURRENT_FEED',current+'feed/'),
            ('LT_CURRENT_AMP',current+'amp/'),
            ('LT_CURRENT_JINA','https://r.jina.ai/https://www.livetennis.it/post/469551/challenger-cancun-quebec-city-kingston-roehampton-praga-e-sion-la-situazione-aggiornata-darderi-si-cancella-da-cancun/'),
            ('LT_OLD',old),
            ('LT_OLD_REST','https://www.livetennis.it/wp-json/wp/v2/posts/446046?context=view'),
            ('CHQ_TWSTALKER','https://www.twstalker.com/CHQ_Updates'),
            ('CHQ_TWSTALKER_M','https://mobile.twstalker.com/CHQ_Updates'),
            ('CHQ_TWSTALKER_W','https://w.twstalker.com/CHQ_Updates'),
            ('CHQ_X','https://x.com/CHQ_Updates'),
            ('CHQ_XCANCEL','https://xcancel.com/CHQ_Updates'),
          ]
          for q in ['Cancun Qualifying','Quebec City Qualifying','Kingston Qualifying','Roehampton Qualifying','Prague Qualifying','Praga Qualifying','Sion Qualifying','CHQ_Updates Cancun','CHQ_Updates Quebec','CHQ_Updates Kingston','CHQ_Updates Roehampton','CHQ_Updates Prague','CHQ_Updates Sion']:
            urls += [(f'TWSEARCH_{q}','https://www.twstalker.com/search/'+urllib.parse.quote(q)),(f'TWSEARCHM_{q}','https://mobile.twstalker.com/search/'+urllib.parse.quote(q))]
          for label,url in urls:
            st,final,b=get(url)
            print('\n\n=====SOURCE',label,'STATUS',st,'BYTES',len(b),'FINAL',final,'=====')
            if not b: continue
            # For REST JSON, render the HTML content field as text as well.
            texts=[]
            try:
              j=json.loads(b)
              if isinstance(j,dict):
                for k in ['date','modified','link']:
                  if j.get(k): print('META',k,j[k])
                c=j.get('content',{})
                if isinstance(c,dict) and c.get('rendered'): texts.append(clean(c['rendered']))
            except Exception: pass
            texts.append(clean(b))
            emitted=set()
            for t in texts:
              for a,z,why in excerpts(t):
                chunk=t[a:z].strip()
                key=chunk[:300]
                if key in emitted: continue
                emitted.add(key)
                print('\n---HIT',why,'---\n'+chunk)
            ids=re.findall(r'(?:status/)(\d{10,})',b)
            if ids: print('\nSTATUS_IDS',','.join(dict.fromkeys(ids)))
          PY
      - name: Commit recon output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/q-alt-source-output.txt
          git commit -m "Save Q alternate source recon output" || exit 0
          git push
