name: Q alternate source recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/q-alt-source-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public sources and mirrors
        run: |
          python3 - <<'PY'
          import html, re, urllib.request, urllib.parse
          from html.parser import HTMLParser

          TARGETS = ['cancun','quebec','kingston','roehampton','prague','praga','sion','qualifying','alternate','next','laslo djere','soonwoo kwon','aidan kim','lorenzo carboni','nicolas tepmahc','theo papamalamis']
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8'}

          class Text(HTMLParser):
            def __init__(self): super().__init__(); self.out=[]; self.skip=0
            def handle_starttag(self,tag,attrs):
              if tag in ('script','style','noscript'): self.skip+=1
              if tag in ('p','div','li','h1','h2','h3','h4','br','tr','td','th','article'): self.out.append('\n')
            def handle_endtag(self,tag):
              if tag in ('script','style','noscript') and self.skip: self.skip-=1
              if tag in ('p','div','li','h1','h2','h3','h4','tr','article'): self.out.append('\n')
            def handle_data(self,data):
              if not self.skip: self.out.append(data)

          def get(url):
            try:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=20) as r:
                b=r.read().decode('utf-8','replace')
                return r.status,r.geturl(),b
            except Exception as e:
              return 'ERR',str(e),''

          def vis(body):
            p=Text(); p.feed(body); t=html.unescape(''.join(p.out))
            return re.sub(r'\n\s*\n+','\n',re.sub(r'[ \t]+',' ',t.replace('\r','')))

          urls=[
            'https://x.com/CHQ_Updates',
            'https://mobile.twitter.com/CHQ_Updates',
            'https://twstalker.com/CHQ_Updates',
            'https://mobile.twstalker.com/CHQ_Updates',
            'https://w.twstalker.com/CHQ_Updates',
            'https://xcancel.com/CHQ_Updates',
            'https://nitter.poast.org/CHQ_Updates',
            'https://r.jina.ai/https://x.com/CHQ_Updates',
            'https://r.jina.ai/http://x.com/CHQ_Updates',
            'https://www.dartsrankings.com/tennis/cancun',
            'https://entries.ticktocktennis.com/atp',
          ]
          for url in urls:
            st,final,b=get(url)
            print('\n===== URL',url,'STATUS',st,'FINAL',final,'BYTES',len(b),'=====')
            if not b: continue
            text=vis(b)
            print('VISIBLE_HEAD',text[:1200].replace('\n',' | '))
            low=text.lower()
            hits=[]
            for term in TARGETS:
              pos=low.find(term)
              if pos>=0: hits.append((term,pos))
            print('HITS',hits)
            for term,pos in hits[:12]:
              print('\n---',term,'---\n',text[max(0,pos-500):pos+1600])
            if 'dartsrankings.com' in url:
              print('\nDARTS SCRIPT/API HINTS')
              for m in re.finditer(r'.{0,180}(?:fetch\(|axios|api/|\.json|__NEXT_DATA__|script src=).{0,300}',b,re.I|re.S):
                print(re.sub(r'\s+',' ',m.group(0))[:700])

          queries=[
            '"CHQ_Updates" Cancun qualifying',
            '"CHQ_Updates" "Quebec City" qualifying',
            '"CHQ_Updates" Kingston qualifying tennis',
            '"CHQ_Updates" Roehampton qualifying tennis',
            '"CHQ_Updates" Prague qualifying tennis',
            '"CHQ_Updates" Sion qualifying tennis',
            '"Laslo Djere" Cancun alternate 2026',
            '"Soonwoo Kwon" "Quebec City" alternate 2026',
            '"Aidan Kim" Kingston alternate tennis 2026',
            '"Lorenzo Carboni" Prague alternate 2026 tennis',
            '"Nicolas Tepmahc" Roehampton alternate 2026',
            '"Theo Papamalamis" Sion alternate 2026 tennis',
          ]
          for q in queries:
            url='https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q)
            st,final,b=get(url); text=vis(b)
            print('\n===== DDG',q,'STATUS',st,'BYTES',len(b),'=====')
            print(text[:5000])
          PY
