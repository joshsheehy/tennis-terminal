name: Q alternate source recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/q-alt-source-recon.yml'

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect TickTock raw entry data
        run: |
          mkdir -p research
          python3 - <<'PY' > research/ticktock-raw-output.txt
          import urllib.request,re,html,json,urllib.parse,datetime
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'text/html,application/javascript,application/json,*/*'}
          def get(u):
            try:
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.geturl(),r.read().decode('utf-8','replace')
            except Exception as e:return 'ERR',str(e),''
          print('RUN_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat())
          urls=['https://entries.ticktocktennis.com/atp','https://entries.ticktocktennis.com/atp.html','https://entries.ticktocktennis.com/']
          fetched={}
          for u in urls:
            st,final,b=get(u); fetched[u]=b
            print('\n===== PAGE',u,'STATUS',st,'BYTES',len(b),'FINAL',final,'=====')
            for needle in ['qualAlt','qnext','Qualifying Next-In','Cancun','Quebec City','Kingston','Roehampton','Prague','Sion','Aug 17','2026-08-17']:
              poss=[m.start() for m in re.finditer(re.escape(needle),b,re.I)]
              print('NEEDLE',needle,'COUNT',len(poss),'POS',poss[:20])
              for p in poss[:8]: print('\nCTX',needle,'\n',b[max(0,p-1000):p+6000])
            scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',b,re.I)
            print('\nSCRIPTS')
            for s in scripts: print(s)
          # fetch JS assets and search for schema/endpoints
          base='https://entries.ticktocktennis.com/'
          scripts=[]
          for b in fetched.values(): scripts += re.findall(r'<script[^>]+src=["\']([^"\']+)',b,re.I)
          seen=set()
          for s in scripts:
            u=urllib.parse.urljoin(base,s)
            if u in seen: continue
            seen.add(u)
            st,final,b=get(u)
            print('\n===== JS',u,'STATUS',st,'BYTES',len(b),'=====')
            for needle in ['qualAlt','qnext','Qualifying Next-In','fetch(','json','atp','entry','week']:
              poss=[m.start() for m in re.finditer(re.escape(needle),b,re.I)]
              if poss: print('NEEDLE',needle,'COUNT',len(poss),'POS',poss[:15])
              for p in poss[:8]: print('\nCTX',needle,'\n',b[max(0,p-1200):p+5000])
            # print likely data URLs
            for m in re.finditer(r'https?://[^"\'\s)]+|["\'][^"\']+\.(?:json|csv)[^"\']*["\']',b,re.I):
              val=m.group(0)
              if any(x in val.lower() for x in ['json','entry','atp','data','list']): print('URL_HINT',val[:700])
          PY
      - name: Commit recon output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ticktock-raw-output.txt
          git commit -m "Save TickTock raw entry recon" || exit 0
          git push
