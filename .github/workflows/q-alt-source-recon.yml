name: Q alternate source recon
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/q-alt-source-recon.yml']
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse Brownsburg entry list and qualifying draw
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p research/brownsburg-reconstruct
          python3 -m pip -q install pypdf
          python3 - <<'PY'
          import io,json,re,urllib.request,pathlib
          from pypdf import PdfReader
          base='https://www.usta.com/content/dam/usta/pro-circuit/2026/20260810_brownsburg_m75/'
          docs={'entry':'brownsburg-challenger-mds-entry-list.pdf','qs':'qs.pdf','ll':'ll.pdf'}
          out={}
          for k,f in docs.items():
              url=base+f
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.usta.com/'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read(); hd=dict(r.headers)
              reader=PdfReader(io.BytesIO(b)); text='\n'.join((p.extract_text() or '') for p in reader.pages)
              pathlib.Path(f'research/brownsburg-reconstruct/{k}.txt').write_text(text)
              out[k]={'url':url,'bytes':len(b),'last_modified':hd.get('Last-Modified'),'pages':len(reader.pages),'chars':len(text)}
              print('\n###',k,json.dumps(out[k],indent=2)); print(text[:30000])
          pathlib.Path('research/brownsburg-reconstruct/meta.json').write_text(json.dumps(out,indent=2))
          PY
      - name: Build comparison excerpts
        run: |
          {
            echo '=== ENTRY ALTERNATES ==='
            grep -n -A140 '^Alternates' research/brownsburg-reconstruct/entry.txt || true
            echo '=== Q DRAW ALT / WITHDRAW / LDA ==='
            grep -niE -C3 'Alt|Alternates|Withdraw|Last Direct|Moved to Main|Qualifying' research/brownsburg-reconstruct/qs.txt || true
            echo '=== FULL Q TEXT ==='
            cat research/brownsburg-reconstruct/qs.txt
          } > research/brownsburg-reconstruct/comparison.txt
          head -n 1600 research/brownsburg-reconstruct/comparison.txt
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/brownsburg-reconstruct
          git commit -m "Save Brownsburg Q reconstruction comparison" || exit 0
          git push
