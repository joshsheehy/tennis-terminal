name: Q alternate source recon
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/q-alt-source-recon.yml']
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Crawl public organizer pages, CMS assets, and documents
        run: |
          mkdir -p research/week33-organizers
          python3 - <<'PY' > research/week33-organizers/trace.txt
          import urllib.request, urllib.parse, re, json, html, pathlib, time
          from urllib.parse import urljoin, urlparse
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'text/html,application/json,*/*'}
          seeds={
            'cancun':['https://www.cancuncountryopen.com/','https://www.cancuncountryopen.com/jugadores?y=2026','https://www.cancuncountryopen.com/cuadro-qualy','https://cancun-country-open-431d0732c9ce.herokuapp.com/'],
            'sion':['https://opendesion.com/','https://opendesion.com/pages/draws','https://opendesion.com/sitemap.xml','https://opendesion.com/robots.txt'],
            'quebec':['https://www.tenniscanada.com/national-bank-challengers','https://www.tenniscanada.com/news/pro-tennis/2025/new-atp-challenger-125-coming-to-quebec-city-2026'],
            'roehampton':['https://www.lta.org.uk/fan-zone/international/','https://www.lta.org.uk/fan-zone/international/lexus-roehampton-challenger/'],
            'prague':['https://www.pragueopen.net/','https://www.cztenis.cz/','https://www.cztenis.cz/clanek/advantage-cars-prague-open-2026'],
            'kingston':['http://tennisjamaica.org/','https://tennisjamaica.org/'],
          }
          def get(u,timeout=22):
            try:
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                b=r.read(); return r.status,r.geturl(),b,dict(r.headers)
            except Exception as e:return getattr(e,'code','ERR'),repr(e),b'',{}
          def text(b): return b.decode('utf-8','replace')
          KEY=re.compile(r'official player acceptance|original cut off|rankings date|entry.?list|acceptance|alternate|qualif|challenger|player.?list|pdf|document|media|upload|asset|api|json|graphql|heroku|storage|cdn',re.I)
          for label,starts in seeds.items():
            print('\n\n################',label.upper(),'################')
            q=list(starts); seen=set(); assets=[]
            # breadth-first at most 18 public pages/resources per source family
            while q and len(seen)<18:
              u=q.pop(0)
              if u in seen: continue
              seen.add(u)
              st,final,b,h=get(u)
              print('\n===== URL',u,'STATUS',st,'BYTES',len(b),'FINAL',final,'TYPE',h.get('Content-Type'),'=====')
              if not b: continue
              s=text(b)
              # Print high-value lines/snippets
              for m in list(KEY.finditer(s))[:50]:
                print('HIT',re.sub(r'\s+',' ',s[max(0,m.start()-260):m.start()+700])[:1100])
              # collect URLs/assets
              vals=[]
              for pat in [r'(?:href|src|action|data-[\w-]+)=["\']([^"\']+)',r'https?://[^\s"\'<>]+']:
                for m in re.finditer(pat,s,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=html.unescape(v).replace('\\/','/')
                  if v.startswith('data:') or v.startswith('#') or v.startswith('mailto:') or v.startswith('tel:'): continue
                  x=urljoin(final,v)
                  if x not in vals: vals.append(x)
              for x in vals:
                if KEY.search(x): print('URL_HINT',x)
                p=urlparse(x)
                if re.search(r'\.pdf(?:\?|$)',p.path,re.I) and x not in assets: assets.append(x)
                # Same host JS/JSON/sitemap/robots/public page links only
                if p.netloc==urlparse(final).netloc and (re.search(r'\.(?:js|json)(?:\?|$)',p.path,re.I) or 'sitemap' in p.path or 'robots' in p.path):
                  if x not in q and x not in seen: q.append(x)
                # Cancun Heroku assets/API paths are explicitly linked by the public site
                if label=='cancun' and ('herokuapp.com' in p.netloc) and x not in q and x not in seen and len(q)<25:
                  q.append(x)
            print('\n--- PDF/DOCUMENT CANDIDATES',len(assets),'---')
            for x in assets[:100]:
              st,final,b,h=get(x); print('DOC',st,len(b),h.get('Content-Type'),final)
              if b.startswith(b'%PDF'):
                safe=re.sub(r'[^A-Za-z0-9_.-]+','_',label+'_'+x.split('/')[-1].split('?')[0])[:160]
                pathlib.Path('research/week33-organizers/'+safe).write_bytes(b)
          PY
      - name: Grep result for ATP acceptance fingerprint
        run: |
          grep -Ein -C2 'Official Player Acceptance|Original Cut Off|Rankings Date|entry.?list|alternate|qualif|pdf|api|json|heroku' research/week33-organizers/trace.txt | head -n 3500 || true
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/week33-organizers
          git commit -m "Save Week 33 organizer asset crawl" || exit 0
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
