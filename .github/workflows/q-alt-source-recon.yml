name: Q alternate source recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/q-alt-source-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trace LiveTennis Q-list backend
        run: |
          python3 - <<'PY'
          import re, urllib.request, html
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'text/html,application/json,*/*'}
          def get(url):
            try:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:
                return r.status,r.geturl(),r.read().decode('utf-8','replace')
            except Exception as e:return 'ERR',str(e),''

          pages={
            'old':'https://www.livetennis.it/post/446046/challenger-todi-cancun-barranquilla-sumter-sofia-1-e-hersonissos-3-la-situazione-aggiornata-md-e-qualificazioni/',
            'current':'https://www.livetennis.it/post/469551/challenger-cancun-quebec-city-kingston-roehampton-praga-e-sion-la-situazione-aggiornata-darderi-si-cancella-da-cancun/',
          }
          for label,url in pages.items():
            st,final,b=get(url)
            print('\n=====PAGE',label,st,len(b),final,'=====')
            low=b.lower()
            for needle in ['challenger cancun (q)','cancun (q)','entry list','alternates','ajax','admin-ajax','wp-json','shortcode','tournament','qualific']:
              poss=[m.start() for m in re.finditer(re.escape(needle),low)]
              print('\nNEEDLE',needle,'COUNT',len(poss),'FIRST',poss[:10])
              for pos in poss[:4]:
                print(b[max(0,pos-1200):pos+3000])
            print('\n--- ATTR/HREF HINTS ---')
            for m in re.finditer(r'<[^>]+(?:data-[^=>]+|onclick|href|src)=[^>]+>',b,re.I):
              s=m.group(0)
              if re.search(r'entry|challenger|ajax|qual|cancun|torneo|tournament',s,re.I):
                print(s[:1800])
            print('\n--- SCRIPT URLS ---')
            for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',b,re.I):
              print(src)
            print('\n--- FORM/AJAX TOKENS ---')
            for pat in [r'ajaxurl.{0,500}',r'action["\']?\s*[:=].{0,300}',r'nonce.{0,300}',r'wp_ajax.{0,300}',r'fetch\(.{0,500}',r'XMLHttpRequest.{0,500}',r'\.post\(.{0,500}']:
              for m in re.finditer(pat,b,re.I|re.S):
                print(re.sub(r'\s+',' ',m.group(0))[:1000])
          PY
