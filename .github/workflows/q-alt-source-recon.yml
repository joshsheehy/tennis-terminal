name: Q alternate source recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/q-alt-source-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe CHQ update mirrors
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, html
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'text/html,*/*'}
          def get(url):
            try:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=22) as r:
                return r.status,r.geturl(),r.read().decode('utf-8','replace')
            except Exception as e:return 'ERR',str(e),''
          def clean(s):
            s=re.sub(r'<script.*?</script>',' ',s,flags=re.S|re.I)
            s=re.sub(r'<style.*?</style>',' ',s,flags=re.S|re.I)
            s=re.sub(r'<[^>]+>','\n',s)
            s=html.unescape(s)
            s=re.sub(r'[ \t]+',' ',s)
            return re.sub(r'\n\s*\n+','\n',s)
          urls=[
            'https://www.twstalker.com/CHQ_Updates',
            'https://mobile.twstalker.com/CHQ_Updates',
            'https://w.twstalker.com/CHQ_Updates',
            'https://twstalker.com/CHQ_Updates',
            'https://x.com/CHQ_Updates',
            'https://mobile.x.com/CHQ_Updates',
            'https://nitter.poast.org/CHQ_Updates',
            'https://nitter.privacydev.net/CHQ_Updates',
            'https://xcancel.com/CHQ_Updates',
          ]
          search_terms=['Cancun','Quebec','Kingston','Roehampton','Prague','Praga','Sion','Qualifying update','OUT:','Next:']
          for base in ['https://mobile.twstalker.com/search/','https://www.twstalker.com/search/']:
            for q in ['Cancun Qualifying','Quebec City Qualifying','Kingston Qualifying','Roehampton Qualifying','Prague Qualifying','Sion Qualifying']:
              urls.append(base+urllib.parse.quote(q))
          for url in urls:
            st,final,b=get(url); t=clean(b)
            print(f'\n===== {url} STATUS={st} BYTES={len(b)} FINAL={final} =====')
            if not t: continue
            low=t.lower(); hits=[]
            for term in search_terms:
              for m in list(re.finditer(re.escape(term.lower()),low))[:12]:hits.append((m.start(),term))
            if hits:
              for pos,term in sorted(set(hits))[:60]:
                print(f'--- {term} @{pos} ---')
                print(t[max(0,pos-500):pos+1600])
            else:
              print(t[:4500])
            ids=re.findall(r'(?:status/)(\d{10,})',b)
            if ids: print('STATUS_IDS',list(dict.fromkeys(ids))[:100])
          PY
