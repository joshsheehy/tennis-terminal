name: Q alternate source recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/q-alt-source-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe X search and public syndication
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, html
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'text/html,application/json,*/*'}
          def get(url):
            try:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:
                return r.status,r.geturl(),r.read().decode('utf-8','replace')
            except Exception as e: return 'ERR',str(e),''
          def clean(s):
            s=re.sub(r'<script.*?</script>',' ',s,flags=re.S|re.I)
            s=re.sub(r'<style.*?</style>',' ',s,flags=re.S|re.I)
            s=re.sub(r'<[^>]+>','\n',s)
            s=html.unescape(s)
            s=re.sub(r'[ \t]+',' ',s)
            return re.sub(r'\n\s*\n+','\n',s)

          queries=[
            'from:CHQ_Updates Cancun since:2026-07-20 until:2026-08-12',
            'from:CHQ_Updates Quebec since:2026-07-20 until:2026-08-12',
            'from:CHQ_Updates Kingston since:2026-07-20 until:2026-08-12',
            'from:CHQ_Updates Roehampton since:2026-07-20 until:2026-08-12',
            'from:CHQ_Updates Prague since:2026-07-20 until:2026-08-12',
            'from:CHQ_Updates Sion since:2026-07-20 until:2026-08-12',
            'from:CHQ_Updates "Qualifying list" since:2026-07-20 until:2026-08-12',
            'from:CHQ_Updates "Next:" since:2026-07-20 until:2026-08-12',
          ]
          urls=[
            'https://syndication.twitter.com/srv/timeline-profile/screen-name/CHQ_Updates',
            'https://syndication.twitter.com/srv/timeline-profile/screen-name/CHQ_Updates?dnt=true',
          ]
          for q in queries:
            enc=urllib.parse.quote(q)
            urls += [
              f'https://x.com/search?q={enc}&src=typed_query&f=live',
              f'https://r.jina.ai/https://x.com/search?q={enc}%26src=typed_query%26f=live',
              f'https://r.jina.ai/http://x.com/search?q={enc}%26src=typed_query%26f=live',
            ]
          for url in urls:
            st,final,b=get(url)
            t=clean(b) if b else ''
            print('\n===== ',url,' STATUS ',st,' BYTES ',len(b),' FINAL ',final,' =====')
            print(t[:9000])
            ids=re.findall(r'(?:status/|tweet_id["=:]+)(\d{10,})',b)
            if ids: print('TWEET_IDS',list(dict.fromkeys(ids))[:50])
          PY
