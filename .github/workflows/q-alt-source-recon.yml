name: Q alternate source recon
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/q-alt-source-recon.yml']
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe derived USTA Q entry-list artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p research/usta-q-siblings/pdfs research/usta-q-siblings/text
          python3 - <<'PY'
          import urllib.request, pathlib, re
          base='https://www.usta.com'
          events={
            'tyler':('/content/dam/usta/pro-circuit/2026/20260601_tyler_m75/','tyler-mds-entry-list.pdf'),
            'cary':('/content/dam/usta/pro-circuit/2026/20260629_cary_m75/','cary-2026-mds-entry-list.pdf'),
            'lincoln':('/content/dam/usta/pro-circuit/2026/20260713_lincoln_m75/','lincoln-challenger-2026-mds-entry-list.pdf'),
            'bloomfield':('/content/dam/usta/pro-circuit/2026/20260720_bloomfieldhills_m125/','bloomfield-hills-challenger-2026-entry-list-mds.pdf'),
            'lexington':('/content/dam/usta/pro-circuit/2026/20260803_lexington_m75/','2026-lexington-challenger-mds-entry-list.pdf'),
            'brownsburg':('/content/dam/usta/pro-circuit/2026/20260810_brownsburg_m75/','brownsburg-challenger-mds-entry-list.pdf'),
          }
          lines=[]
          def variants(fn):
              out=[fn,'ll.pdf']
              reps=[
                fn.replace('mds','qs'),
                fn.replace('MDS','QS'),
                fn.replace('entry-list-mds','entry-list-qs'),
                fn.replace('mds-entry-list','qs-entry-list'),
              ]
              stem=fn[:-4] if fn.lower().endswith('.pdf') else fn
              generic=['qs-entry-list.pdf','qualifying-entry-list.pdf','qualifying-alternates.pdf','q-alternates.pdf','qualifying-alternate-list.pdf']
              for x in reps+generic:
                  if x!=fn and x not in out: out.append(x)
              return out
          for ev,(folder,fn) in events.items():
              for cand in variants(fn):
                  url=base+folder+cand
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':base+'/en/home/pro/pro-tennis-events/usta-mens-competitive-pathway.html'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          b=r.read(); ct=r.headers.get('Content-Type',''); status=r.status
                      ispdf=b.startswith(b'%PDF')
                      lines.append(f'{ev}\t{cand}\tHTTP={status}\tBYTES={len(b)}\tTYPE={ct}\tPDF={ispdf}\t{url}')
                      if ispdf:
                          safe=re.sub(r'[^A-Za-z0-9_.-]+','_',cand)
                          pathlib.Path(f'research/usta-q-siblings/pdfs/{ev}__{safe}').write_bytes(b)
                  except Exception as e:
                      code=getattr(e,'code','ERR')
                      lines.append(f'{ev}\t{cand}\tHTTP={code}\t{url}')
          pathlib.Path('research/usta-q-siblings/results.tsv').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY
      - name: Extract PDF text
        run: |
          for f in research/usta-q-siblings/pdfs/*.pdf; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .pdf)
            pdftotext -layout "$f" "research/usta-q-siblings/text/$b.txt" || true
          done
          echo '=== PDF TEXT HITS ==='
          grep -RaiEn 'qualif|alternate|entry list|withdraw|ranking|next|lucky loser' research/usta-q-siblings/text | head -n 1200 || true
          echo '=== ALL TEXT FILE HEADERS ==='
          for f in research/usta-q-siblings/text/*.txt; do echo "##### $f #####"; head -n 100 "$f"; done
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/usta-q-siblings
          git commit -m "Save USTA Q entry-list sibling probe" || exit 0
          git push
