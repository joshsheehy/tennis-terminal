name: ProTennisLive client profiles recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/protennis-client-profiles-recon.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public Swagger client profiles
        run: |
          python3 - <<'PY'
          import json, urllib.error, urllib.request

          base='https://api.protennislive.com/feeds/swagger/{}/swagger.json'
          profiles=['orgclient','tournamentclient','websiteclient','mobileclient','publicclient','playerclient','mediaclient']
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for profile in profiles:
            url=base.format(profile)
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=15) as r:
                body=r.read()
                print('\nPROFILE',profile,'STATUS',r.status,'BYTES',len(body),flush=True)
                spec=json.loads(body)
                print('TITLE',spec.get('info',{}).get('title'),'SERVER',spec.get('servers'),'GLOBAL_SECURITY',spec.get('security'),flush=True)
                schemes=spec.get('components',{}).get('securitySchemes',{})
                print('SECURITY_SCHEMES',json.dumps(schemes)[:1200],flush=True)
                paths=spec.get('paths',{})
                interesting=[p for p in paths if any(k in p.lower() for k in ['playerlist','tournament','draw','schedule','rank','participant'])]
                print('PATH_COUNT',len(paths),'INTERESTING',interesting,flush=True)
                for p in interesting:
                  op=paths[p].get('get',{})
                  print(' PATH',p,'summary=',op.get('summary'),'security=',op.get('security','<inherits>'),flush=True)
            except urllib.error.HTTPError as e:
              print('\nPROFILE',profile,'STATUS',e.code,'BODY',e.read(300).decode('utf-8','replace'),flush=True)
            except Exception as e:
              print('\nPROFILE',profile,'ERROR',type(e).__name__,str(e),flush=True)
          PY
