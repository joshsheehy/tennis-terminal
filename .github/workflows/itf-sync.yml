name: ITF calendar sync

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season year (defaults to current year)
        default: ''
      circuit:
        description: men or women
        default: 'men'
  schedule:
    # Daily at 07:30 UTC, before the main data sync.
    - cron: '30 7 * * *'
  # The session's GitHub token cannot dispatch workflows; pushes touching
  # these files trigger a run so the first import happens automatically.
  push:
    paths:
      - '.github/workflows/itf-sync.yml'
      - 'scripts/itf-runner-fetch.mts'

jobs:
  itf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      YEAR: ${{ inputs.year || '' }}
      CIRCUIT: ${{ inputs.circuit || 'men' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch and parse ITF calendar on this runner
        run: |
          YEAR="${YEAR:-$(date -u +%Y)}"
          echo "YEAR=$YEAR" >> "$GITHUB_ENV"
          npx tsx scripts/itf-runner-fetch.mts "$YEAR" "$CIRCUIT" /tmp/itf-rows.json

      - name: POST parsed ITF events to production
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          base = os.environ['APP_URL'].strip().rstrip('/')
          secret = os.environ['ADMIN_SECRET']
          payload = json.load(open('/tmp/itf-rows.json'))
          rows = payload['rows']
          year = payload['year']
          print(f"POSTing {len(rows)} ITF events for {year}")

          total = 0
          for start in range(0, len(rows), 250):
              chunk = {'year': year, 'rows': rows[start:start+250]}
              body = json.dumps(chunk).encode()
              for attempt in range(1, 6):
                  req = urllib.request.Request(
                      f'{base}/api/import-itf-rows?apply=true',
                      data=body, method='POST',
                      headers={'Content-Type': 'application/json', 'X-Admin-Secret': secret, 'Accept': 'application/json'},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=180) as res:
                          out = json.loads(res.read())
                          up = (out.get('upserted') or {})
                          print(f"chunk {start}: ok={out['ok']} valid={out['validCount']} invalid={out['invalidCount']} upserted={up.get('upsertedEditions')}")
                          if not out['ok']:
                              print(json.dumps(out.get('invalid', []), indent=1))
                              print(json.dumps((up.get('errors') or [])[:5], indent=1))
                              raise SystemExit(1)
                          total += up.get('upsertedEditions') or 0
                          break
                  except SystemExit:
                      raise
                  except Exception as exc:
                      print(f'chunk {start} attempt {attempt} failed: {exc}')
                      if attempt == 5:
                          raise SystemExit(1)
                      time.sleep(20 * attempt)

          print(f'TOTAL ITF EDITIONS UPSERTED: {total}')
          if total == 0:
              raise SystemExit(1)
          PY
