name: ITF calendar sync

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season year (defaults to current year)
        default: ''
      circuit:
        description: men or women
        default: 'men'
  schedule:
    # Daily at 07:30 UTC, before the main data sync.
    - cron: '30 7 * * *'
  # The session's GitHub token cannot dispatch workflows; pushes touching
  # these files trigger a run so the first import happens automatically.
  push:
    paths:
      - '.github/workflows/itf-sync.yml'
      - 'scripts/itf-runner-fetch.mts'

jobs:
  itf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      YEAR: ${{ inputs.year || '' }}
      CIRCUIT: ${{ inputs.circuit || 'men' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch and parse ITF calendar on this runner
        run: |
          # A year input limits the run; default covers every season the site
          # serves so the ITF pill exists on all year tabs.
          YEARS="${YEAR:-2024 2025 2026}"
          ok=0
          for Y in $YEARS; do
            if npx tsx scripts/itf-runner-fetch.mts "$Y" "$CIRCUIT" "/tmp/itf-rows-$Y.json"; then
              ok=$((ok+1))
            else
              echo "WARNING: ITF fetch/parse failed for $Y"
            fi
          done
          # itftennis.com periodically bot-blocks the runner — that's transient
          # and recovers next day, so don't fail/email on it. If ITF genuinely
          # stays broken, the data-sync discovery-health gate (which tracks
          # itf_calendar_api freshness with a 4-day window) is the single place
          # that alerts. Exit 0 here either way.
          if [ "$ok" -gt 0 ]; then
            echo "ITF fetch produced events for $ok season(s)."
          else
            echo "WARN: no season produced any events this run (likely a transient itftennis block); leaving ITF as-is."
          fi

      - name: POST parsed ITF events to production
        run: |
          python3 - <<'PY'
          import glob, json, os, time, urllib.request

          base = os.environ['APP_URL'].strip().rstrip('/')
          secret = os.environ['ADMIN_SECRET']

          files = sorted(glob.glob('/tmp/itf-rows-*.json'))
          if not files:
              # All fetches were blocked this run (transient itftennis block).
              # Nothing to post; don't fail/email — the data-sync health gate
              # alerts if ITF data actually goes stale for 4+ days.
              print('WARN: no parsed ITF row files this run (transient fetch block); nothing to post.')
              raise SystemExit(0)

          grand_total = 0
          for path in files:
              payload = json.load(open(path))
              rows = payload['rows']
              year = payload['year']
              print(f"POSTing {len(rows)} ITF events for {year}")
              total = 0
              for start in range(0, len(rows), 100):
                  chunk = {'year': year, 'rows': rows[start:start+100]}
                  body = json.dumps(chunk).encode()
                  for attempt in range(1, 6):
                      req = urllib.request.Request(
                          f'{base}/api/import-itf-rows?apply=true',
                          data=body, method='POST',
                          headers={
                              'Content-Type': 'application/json',
                              'X-Admin-Secret': secret,
                              'Accept': 'application/json',
                              # urllib's default Python UA gets 403'd by the WAF.
                              'User-Agent': 'TennisCutsITFSync/1.0 (+https://tenniscuts.com)',
                          },
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=180) as res:
                              out = json.loads(res.read())
                              up = (out.get('upserted') or {})
                              print(f"  {year} chunk {start}: ok={out['ok']} valid={out['validCount']} invalid={out['invalidCount']} upserted={up.get('upsertedEditions')}")
                              if not out['ok']:
                                  print(json.dumps(out.get('invalid', []), indent=1))
                                  print(json.dumps((up.get('errors') or [])[:5], indent=1))
                                  raise SystemExit(1)
                              total += up.get('upsertedEditions') or 0
                              break
                      except SystemExit:
                          raise
                      except Exception as exc:
                          print(f'  {year} chunk {start} attempt {attempt} failed: {exc}')
                          if attempt == 5:
                              raise SystemExit(1)
                          time.sleep(20 * attempt)
              print(f'{year}: upserted {total} ITF editions')
              grand_total += total

          print(f'TOTAL ITF EDITIONS UPSERTED: {grand_total}')
          if grand_total == 0:
              raise SystemExit(1)
          PY
