name: Historical season backfill

# One-time backfill of a full historical season (calendar + cuts).
#
# PRIMARY SOURCE: ProTennisLive — the ATP's own posting system. The runner
# sweeps /posting/{year}/{code}/ for the whole code range, parses each
# posting's header (name, city, dates, surface, era-correct category), and
# POSTs the season to /api/import-ptl-postings. Everything that published an
# entry list is captured — defunct tournaments included — and the code rides
# along so the cut import that follows resolves every PDF directly.
# (JeffSackmann's qual_chall CSVs don't exist before ~2024, so they're only a
# tolerant enrichment pass here, not a dependency.)
#
# Run once per season from the Actions tab (2022, then 2023). Idempotent —
# rerunning only fills gaps.

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Season to backfill (idempotent — rerunning any season only fills gaps)'
        required: true
        type: choice
        options: ['2022', '2023', '2024', '2025', '2026']
      code_start:
        description: 'First ProTennisLive code to probe'
        required: false
        default: '1'
      code_end:
        description: 'Last ProTennisLive code to probe'
        required: false
        default: '9999'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Scan ProTennisLive postings for the season
        env:
          YEAR: ${{ inputs.year }}
          CODE_START: ${{ inputs.code_start }}
          CODE_END: ${{ inputs.code_end }}
        run: |
          set -euo pipefail
          node scripts/scan-ptl-season.mjs "$YEAR" \
            --start "$CODE_START" --end "$CODE_END" \
            --concurrency 12 \
            --emit-rows /tmp/ptl-rows.json
          test -s /tmp/ptl-rows.json || { echo "scan produced no rows"; exit 1; }

      - name: Import season into production
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "Missing APP_URL repository secret."
            exit 1
          fi
          if [ -z "${ADMIN_SECRET:-}" ]; then
            echo "Missing ADMIN_SECRET repository secret."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['APP_URL'].strip().rstrip('/')
          if not base.startswith(('http://', 'https://')):
              base = 'https://' + base
          secret = os.environ['ADMIN_SECRET']
          year = int(os.environ['YEAR'])

          def request_json(path, *, data=None, method='GET', timeout=180, retries=3, required=True):
              url = base + path
              last_error = None
              for attempt in range(1, retries + 1):
                  req = urllib.request.Request(
                      url,
                      data=data,
                      method=method,
                      headers={
                          'Accept': 'application/json',
                          'Content-Type': 'application/json',
                          'User-Agent': 'TennisCutsHistoricalBackfill/2.0',
                          'X-Admin-Secret': secret,
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as res:
                          return json.loads(res.read().decode('utf-8', errors='replace'))
                  except urllib.error.HTTPError as exc:
                      body = ''
                      try:
                          body = exc.read().decode('utf-8', errors='replace')[:800]
                      except Exception:
                          pass
                      last_error = f'{exc} :: {body}'
                      print(f'{method} {url} attempt {attempt}/{retries} failed: {last_error}', flush=True)
                      if attempt < retries:
                          time.sleep(8 * attempt)
                  except Exception as exc:
                      last_error = exc
                      print(f'{method} {url} attempt {attempt}/{retries} failed: {exc}', flush=True)
                      if attempt < retries:
                          time.sleep(8 * attempt)
              if required:
                  raise RuntimeError(f'{url} failed after {retries} attempts: {last_error}')
              return {'ok': False, 'error': str(last_error)}

          def ensure_ok(label, data):
              if not data.get('ok'):
                  raise RuntimeError(f"{label} reported failure: {data.get('error') or json.dumps(data)[:400]}")
              return data

          def run_paged(label, path_factory, *, max_pages=250, timeout=180, required=True):
              print(f'\n=== {label} ===', flush=True)
              offset = 0
              for _ in range(max_pages):
                  data = request_json(path_factory(offset), timeout=timeout, required=required)
                  if required:
                      ensure_ok(label, data)
                  if not data.get('hasMore'):
                      return data
                  next_offset = data.get('nextOffset')
                  if next_offset is None or next_offset == offset:
                      raise RuntimeError(f'{label} did not return a valid nextOffset')
                  offset = int(next_offset)
                  time.sleep(2)
              print(f'WARNING: {label} hit max_pages={max_pages}', flush=True)
              return {'ok': True, 'hasMore': False}

          # 1) Season calendar straight from the ProTennisLive scan.
          payload = json.load(open('/tmp/ptl-rows.json'))
          rows = payload['rows']
          print(f"=== PTL season import: {len(rows)} postings for {payload['year']} ===", flush=True)
          new_total = 0
          for start in range(0, len(rows), 200):
              chunk = {'year': payload['year'], 'rows': rows[start:start + 200]}
              out = ensure_ok('PTL import', request_json('/api/import-ptl-postings?apply=true',
                                                         data=json.dumps(chunk).encode(), method='POST'))
              print(f"chunk {start}-{start + len(chunk['rows'])}: upserted={out.get('upsertedCount')} "
                    f"new={out.get('newlyAddedCount')}", flush=True)
              for ev in out.get('newlyAdded') or []:
                  print(f"  + wk{ev.get('week')} {ev.get('name')} ({ev.get('level')})", flush=True)
              new_total += out.get('newlyAddedCount') or 0
          print(f'season {year}: {new_total} newly added tournaments', flush=True)

          # 2) Optional enrichment: JeffSackmann (surfaces / cross-check).
          #    His qual_chall CSVs don't exist for 2022/2023, so these are
          #    tolerant — a 404 just skips the pass.
          run_paged(
              f'Challenger season enrichment {year} (optional)',
              lambda offset: f'/api/import-challenger-season?year={year}&limit=50&offset={offset}',
              max_pages=40,
              required=False,
          )
          data = request_json(f'/api/import-atp-schedule?year={year}', timeout=280, required=False)
          print(f"\nATP tour-level enrichment (optional): ok={data.get('ok')} "
                f"imported={data.get('importedCount')}", flush=True)

          # 3) Cut PDFs for every ATP/Challenger edition of the season.
          run_paged(
              f'Cutoff import {year}',
              lambda offset: f'/api/import-cutoffs?year={year}&limit=40&offset={offset}',
              max_pages=250,
          )

          # 4) Cleanups + consolidation (same as the nightly chain).
          for path in (
              '/api/cleanup-bad-cuts?apply=true',
              '/api/cleanup-mismatched-cuts?apply=true',
              '/api/dedupe-by-code?apply=true',
              f'/api/merge-official-challenger-levels?apply=true&year={year}',
              '/api/restore-historical-status',
          ):
              print(f'\n=== GET {path}', flush=True)
              data = request_json(path, timeout=280, required=False)
              print(json.dumps(data)[:600], flush=True)

          # 5) Coordinates for any new tournaments, then swings for the season.
          print('\n=== Geocode ===', flush=True)
          for page in range(60):
              out = request_json('/api/geocode-tournaments?year=all&limit=100&dryRun=false',
                                 timeout=300, required=False)
              remaining = int(out.get('remaining') or 0)
              print(f"page {page + 1}: written={out.get('written')} remaining={remaining}", flush=True)
              if remaining <= 0 or int(out.get('processed') or 0) == 0:
                  break
              if int(out.get('written') or 0) == 0:
                  # Rows processed but nothing written = the rest are permanent
                  # geocode failures; another page would just repeat them.
                  print('no progress on this page; stopping (failures below)', flush=True)
                  break
              time.sleep(2)
          for f in (out.get('failures') or [])[:15]:
              print(f'  ! could not geocode: {json.dumps(f)}', flush=True)

          print('\n=== Recompute swings ===', flush=True)
          out = request_json(f'/api/recompute-swings?dryRun=false&year={year}', timeout=280, required=False)
          print(f"recompute ok={out.get('ok')}", flush=True)

          # 6) Summary: how many editions + cuts the season now has.
          counts = request_json(f'/api/debug-schedule-counts?year={year}', required=False)
          print(f'\nSeason {year} summary: {json.dumps(counts)[:800]}', flush=True)
          print('\nHistorical backfill complete.', flush=True)
          PY
