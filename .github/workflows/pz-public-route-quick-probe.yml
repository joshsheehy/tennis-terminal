name: Public ATP PlayerZone quick probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pz-public-route-quick-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test route families on one Aug 17 event
        run: |
          python3 - <<'PY'
          import re
          import urllib.error
          import urllib.request

          urls = [
            'https://ps-site.atppz.com/Singles/AcceptanceList/2026/3121/P',
            'https://ps-site.atppz.com/Singles/AcceptanceList/2026/3121/D',
            'https://ps.atppz.com/eceas/ECEAS-Report-Data.asp?TournamentID=2026-3121',
            'https://atp-playerzone.com/admin/PlayerServices/ECEAS/ECEAS-Report-Data.asp?TournamentID=2026-3121',
          ]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener = urllib.request.build_opener(NoRedirect)

          for url in urls:
              print('\nURL', url, flush=True)
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/pdf,*/*'})
              try:
                  with opener.open(req, timeout=5) as res:
                      body = res.read(100000)
                      status, headers = res.status, res.headers
              except urllib.error.HTTPError as exc:
                  status, headers, body = exc.code, exc.headers, exc.read(100000)
              except Exception as exc:
                  print('ERROR', type(exc).__name__, str(exc), flush=True)
                  continue
              text = body.decode('utf-8', errors='replace')
              markers = [m for m in ['Official Player','Acceptance List','Original Cut Off','Alternates','Ranking Date','Login','Sign In'] if m.lower() in text.lower()]
              title = re.search(r'<title[^>]*>(.*?)</title>', text, re.I|re.S)
              print('STATUS', status, 'CTYPE', headers.get('content-type'), 'LOCATION', headers.get('location'), 'BYTES', len(body), 'PDF', body.startswith(b'%PDF'), flush=True)
              print('TITLE', re.sub(r'\s+',' ',title.group(1)).strip()[:120] if title else None, 'MARKERS', markers, flush=True)
          PY
