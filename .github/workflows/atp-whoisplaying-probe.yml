name: ATP who-is-playing probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atp-whoisplaying-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe Aug 17 Challenger public roster JSON
        run: |
          python3 - <<'PY'
          import json, re, urllib.error, urllib.request

          events=[('Kingston','3121'),('Prague','600'),('Roehampton','3123'),('Sion','3133'),('Cancun','3009'),('Quebec City','3103')]
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127 Safari/537.36',
            'Accept':'application/json, text/plain, */*',
            'Referer':'https://www.atptour.com/en/tournaments/',
          }
          for name,code in events:
            url=f'https://www.atptour.com/en/-/tournaments/{code}/whoisplaying'
            req=urllib.request.Request(url,headers=headers)
            print('\n===',name,code,'===',flush=True)
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read(1_000_000)
                print('STATUS',r.status,'CTYPE',r.headers.get('content-type'),'BYTES',len(body),'CACHE',r.headers.get('cf-cache-status'),flush=True)
            except urllib.error.HTTPError as e:
              body=e.read(5000); print('STATUS',e.code,'CTYPE',e.headers.get('content-type'),'BYTES',len(body),'PREFIX',re.sub(r'\s+',' ',body[:250].decode('utf-8','replace')),flush=True); continue
            except Exception as e:
              print('ERROR',type(e).__name__,str(e),flush=True); continue
            try:
              data=json.loads(body)
            except Exception as e:
              print('JSON_ERROR',type(e).__name__,'PREFIX',re.sub(r'\s+',' ',body[:500].decode('utf-8','replace')),flush=True); continue
            players=data.get('PlayersList') if isinstance(data,dict) else None
            print('TOP_KEYS',list(data.keys()) if isinstance(data,dict) else type(data).__name__,flush=True)
            print('PLAYERS',len(players) if isinstance(players,list) else None,'EVENT_YEAR',data.get('EventYear') if isinstance(data,dict) else None,flush=True)
            if isinstance(players,list) and players:
              keys=sorted({k for p in players if isinstance(p,dict) for k in p.keys()})
              print('PLAYER_KEYS',keys,flush=True)
              print('FIRST_TWO',json.dumps(players[:2],ensure_ascii=False)[:2500],flush=True)
          PY
