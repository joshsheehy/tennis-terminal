name: Official ATP calendar sync

on:
  workflow_dispatch:
  schedule:
    # Nightly at 07:45 UTC, before the 08:15 data-sync run. New PDFs publish
    # irregularly; a daily runner-parsed pass catches them within 24h.
    - cron: '45 7 * * *'

# The PDF is downloaded and parsed HERE on the GitHub runner, then POSTed to
# /api/import-official-rows. Fetching/parsing the PDF on the Railway web
# process proved flaky (atptour.com 403s datacenter IPs and the parse is
# heavy), so the server-side /api/sync-official-calendar remains only as a
# tolerant backup at the end.
jobs:
  sync-official-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Parse official calendar PDFs on the runner (current + next season)
        run: |
          set -euo pipefail
          year=$(date -u +%Y)
          for y in "$year" "$((year + 1))"; do
            echo "=== Parsing season $y ==="
            node scripts/diagnose-calendar-pdf.mjs "$y" --emit-rows "/tmp/official-rows-$y.json" || true
            if [ -s "/tmp/official-rows-$y.json" ]; then
              echo "season $y: rows emitted"
            else
              echo "season $y: no rows emitted (no PDF found or parse empty)"
            fi
          done

      - name: Import parsed rows into production
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "Missing APP_URL repository secret. Set it to the production Railway URL, for example https://tennis-terminal-production.up.railway.app"
            exit 1
          fi
          if [ -z "${ADMIN_SECRET:-}" ]; then
            echo "Missing ADMIN_SECRET repository secret. Set it to the same value as the ADMIN_SECRET environment variable on Railway."
            exit 1
          fi

          python3 - <<'PY'
          import datetime
          import glob
          import json
          import os
          import time
          import urllib.request

          base = os.environ['APP_URL'].strip().rstrip('/')
          if not base.startswith(('http://', 'https://')):
              base = 'https://' + base
          secret = os.environ['ADMIN_SECRET']

          def request_json(path, *, data=None, method='GET', timeout=180, retries=4):
              url = base + path
              last_error = None
              for attempt in range(1, retries + 1):
                  req = urllib.request.Request(
                      url,
                      data=data,
                      method=method,
                      headers={
                          'Accept': 'application/json',
                          'Content-Type': 'application/json',
                          'User-Agent': 'TennisCutsOfficialCalendarSync/2.0',
                          'X-Admin-Secret': secret,
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as res:
                          return json.loads(res.read().decode('utf-8', errors='replace'))
                  except Exception as exc:
                      last_error = exc
                      print(f'{method} {url} attempt {attempt}/{retries} failed: {exc}', flush=True)
                      if attempt < retries:
                          time.sleep(10 * attempt)
              raise RuntimeError(f'{url} failed after {retries} attempts: {last_error}')

          imported_any = False
          parsed_any = False
          for path in sorted(glob.glob('/tmp/official-rows-*.json')):
              payload = json.load(open(path))
              rows = payload['rows']
              parsed_any = True
              print(f"\n=== {payload['year']}: {len(rows)} rows from {payload['sourcePdfUrl']} ===", flush=True)
              new_total = 0
              for start in range(0, len(rows), 100):
                  chunk = {'year': payload['year'], 'sourcePdfUrl': payload['sourcePdfUrl'], 'rows': rows[start:start + 100]}
                  out = request_json('/api/import-official-rows?apply=true', data=json.dumps(chunk).encode(), method='POST')
                  print(f"chunk {start}-{start + len(chunk['rows'])}: ok={out.get('ok')} upserted={out.get('upsertedCount')} "
                        f"new={out.get('newlyAddedCount')} failed={out.get('failedCount')} invalid={out.get('invalidCount')}", flush=True)
                  for ev in out.get('newlyAdded') or []:
                      print(f"  + wk{ev.get('week')} {ev.get('name')} ({ev.get('level')})", flush=True)
                  if not out.get('ok'):
                      print(json.dumps({'failed': out.get('failed'), 'invalid': out.get('invalid')}, indent=1), flush=True)
                      raise SystemExit(1)
                  new_total += out.get('newlyAddedCount') or 0
                  imported_any = True
              print(f"season {payload['year']}: {new_total} newly added tournaments", flush=True)

          if not parsed_any:
              print('\nNo runner-parsed rows for any season; relying on the server-side backup sync below.', flush=True)

          # Consolidate: fold duplicate rows created by differing name spellings
          # and re-assert visibility, exactly like the manual diagnosis flow.
          if imported_any:
              for path in (
                  '/api/dedupe-by-code?apply=true',
                  '/api/merge-official-challenger-levels?apply=true',
                  '/api/restore-historical-status',
              ):
                  print(f'\n=== GET {path}', flush=True)
                  try:
                      out = request_json(path, timeout=280)
                      print(json.dumps(out)[:800], flush=True)
                  except Exception as exc:
                      print(f'non-fatal: {exc}', flush=True)

          current_year = datetime.date.today().year

          # ProTennisLive code discovery for editions still missing one — this
          # is what unlocks each tournament's detail sheet (ds.pdf), draw PDFs,
          # and cut import. Auto-ranged around the codes we already know for
          # the season; paged via nextStartCode; runs every night (the route
          # short-circuits for free when nothing is missing a code).
          print('\n=== ProTennisLive code discovery ===', flush=True)
          try:
              path = f'/api/discover-codes?year={current_year}&auto=true&apply=true&applyMinConfidence=high'
              end_code = None
              applied_total = 0
              for page in range(30):
                  out = request_json(path, timeout=120, retries=2)
                  if out.get('skipped'):
                      print('all Challenger/ATP editions already have codes — skipped', flush=True)
                      break
                  applied = out.get('applied') or []
                  applied_total += len(applied)
                  for a in applied:
                      print(f"  + code {a.get('code')} -> {a.get('slug')} ({a.get('confidence')})", flush=True)
                  for amb in out.get('ambiguousCodes') or []:
                      print(f"  ? code {amb.get('code')} matched multiple events "
                            f"({', '.join(amb.get('slugs') or [])}) — skipped, needs manual review", flush=True)
                  if end_code is None:
                      end_code = (out.get('range') or {}).get('endCode')
                  if not out.get('hasMore') or out.get('nextStartCode') is None or end_code is None:
                      break
                  path = (f'/api/discover-codes?year={current_year}&auto=true&apply=true'
                          f"&applyMinConfidence=high&startCode={out['nextStartCode']}&endCode={end_code}")
              print(f'code discovery done: {applied_total} codes written', flush=True)
          except Exception as exc:
              print(f'code discovery failed (non-fatal): {exc}', flush=True)

          # Geocode any tournaments still missing coordinates. Without this,
          # newly imported tournaments never appear on the Builder map/timeline
          # (swings-page-data filters events to latitude != null) even though
          # /cuts lists them — the exact "challengers missing through November"
          # failure. Paged; reused cities are free, new ones ~1.1s (Nominatim).
          print('\n=== Geocode new tournaments ===', flush=True)
          try:
              written_total = 0
              for page in range(60):
                  out = request_json('/api/geocode-tournaments?year=all&limit=100&dryRun=false',
                                     timeout=300, retries=2)
                  if not out.get('ok'):
                      print(f'geocode page failed: {json.dumps(out)[:400]}', flush=True)
                      break
                  written_total += int(out.get('written') or 0)
                  remaining = int(out.get('remaining') or 0)
                  processed = int(out.get('processed') or 0)
                  print(f"page {page + 1}: written={out.get('written')} remaining={remaining}", flush=True)
                  if remaining <= 0 or processed == 0:
                      break
                  time.sleep(2)
              print(f'geocoding done: {written_total} tournaments located', flush=True)
              for f in (out.get('failures') or [])[:10]:
                  print(f'  ! could not geocode: {json.dumps(f)}', flush=True)
          except Exception as exc:
              print(f'geocoding failed (non-fatal): {exc}', flush=True)

          # Recompute swings right away so the Builder reflects tonight's
          # imports + coordinates immediately (the 09:45 swings workflow
          # remains as a second pass).
          print('\n=== Recompute swings ===', flush=True)
          try:
              out = request_json('/api/recompute-swings?dryRun=false&year=all', timeout=280, retries=2)
              print(f"recompute ok={out.get('ok')}", flush=True)
          except Exception as exc:
              print(f'swings recompute failed (non-fatal): {exc}', flush=True)

          # Detail-sheet coverage report: probe ds.pdf for every Challenger/ATP
          # edition so the log shows exactly how many fact sheets now resolve.
          print('\n=== Detail-sheet coverage ===', flush=True)
          try:
              offset = 0
              exists = missing = nocode = 0
              for page in range(30):
                  out = request_json(f'/api/verify-detail-sheets?year={current_year}&limit=100&offset={offset}',
                                     timeout=120, retries=2)
                  exists += out.get('existsCount') or 0
                  missing += out.get('missingCount') or 0
                  nocode += out.get('noCodeCount') or 0
                  if not out.get('hasMore') or out.get('nextOffset') is None:
                      break
                  offset = out['nextOffset']
              print(f'detail sheets: {exists} available · {missing} not yet posted · {nocode} still missing a code',
                    flush=True)
          except Exception as exc:
              print(f'detail-sheet verification failed (non-fatal): {exc}', flush=True)

          # Backup: the server-side sync (fetches + parses on Railway). Kept
          # tolerant — it 403s from datacenter IPs often, and the runner path
          # above is the source of truth now.
          for sync_year in (current_year, current_year + 1):
              try:
                  data = request_json(f'/api/sync-official-calendar?year={sync_year}', timeout=240, retries=1)
                  added = data.get('newlyAdded') or []
                  print(f"\nserver-side sync {sync_year}: ok={data.get('ok')} new={len(added)}", flush=True)
              except Exception as exc:
                  print(f'\nserver-side sync {sync_year} failed (non-fatal): {exc}', flush=True)

          # Fill cuts if official PDFs are already posted. Bounded and idempotent.
          for attempt in range(20):
              try:
                  data = request_json('/api/run-all', timeout=60, retries=1)
              except Exception as exc:
                  print(f'run-all attempt failed (non-fatal): {exc}', flush=True)
                  break
              if not data.get('hasMore'):
                  break
              print(f'run-all has more work; attempt {attempt + 1}/20', flush=True)
              time.sleep(3)

          print('\nOfficial calendar sync complete.', flush=True)
          PY
