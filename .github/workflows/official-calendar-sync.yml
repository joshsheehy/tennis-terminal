name: Official ATP calendar sync

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 07:45 UTC. Official ATP calendars do not need hourly refreshes.
    - cron: '45 7 * * 1'

jobs:
  sync-official-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Import official ATP calendar updates
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "Missing APP_URL repository secret. Set it to the production Railway URL, for example https://tennis-terminal-production.up.railway.app"
            exit 1
          fi

          python3 - <<'PY'
          import datetime
          import json
          import os
          import socket
          import time
          import urllib.error
          import urllib.request

          base_url = os.environ['APP_URL'].strip().rstrip('/')
          if not base_url.startswith(('http://', 'https://')):
              base_url = 'https://' + base_url

          def request_json(path: str, *, required: bool = True, timeout: int = 180, retries: int = 3):
              url = base_url + path
              last_error = None
              for attempt in range(1, retries + 1):
                  print(f'\nGET {url} (attempt {attempt}/{retries}, timeout={timeout}s)', flush=True)
                  req = urllib.request.Request(
                      url,
                      headers={
                          'Accept': 'application/json',
                          'User-Agent': 'TennisTerminalOfficialCalendarSync/1.0',
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as res:
                          body = res.read().decode('utf-8', errors='replace')
                          print(body[:5000], flush=True)
                          return json.loads(body)
                  except (socket.timeout, TimeoutError, urllib.error.URLError, ConnectionError) as exc:
                      last_error = exc
                      print(f'TRANSIENT ERROR: {exc}', flush=True)
                      if attempt < retries:
                          time.sleep(5 * attempt)
                          continue
                  except Exception as exc:
                      last_error = exc
                      print(f'ERROR: {exc}', flush=True)
                      break
              if required:
                  raise RuntimeError(f'{url} failed after {retries} attempts: {last_error}')
              return {'ok': False, 'error': str(last_error)}

          current_year = datetime.date.today().year

          # Official atptour.com calendar PDF import. This is first so new
          # Challenger announcements are added before any fallback import runs.
          request_json(f'/api/sync-official-calendar?year={current_year}')

          # Keep the existing broader scraper as a non-blocking fallback for ATP Tour rows.
          request_json(f'/api/scrape-atp-calendar?year={current_year}', required=False)

          # Fill cuts if official PDFs are already posted. This is bounded and idempotent.
          for attempt in range(20):
              data = request_json('/api/run-all', timeout=60, required=False)
              if not data.get('hasMore'):
                  break
              print(f'run-all has more work; attempt {attempt + 1}/20', flush=True)
              time.sleep(3)

          print('\nOfficial calendar sync complete.', flush=True)
          PY
