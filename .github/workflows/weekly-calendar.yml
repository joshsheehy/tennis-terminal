name: Weekly ATP calendar refresh

on:
  workflow_dispatch:
  schedule:
    # Mondays 09:30 UTC — well after Sunday's end-of-week edits propagate.
    - cron: '30 9 * * 1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull current + next-season calendar from atptour.com
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "Missing APP_URL repository secret."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import socket
          import time
          import urllib.error
          import urllib.request

          base_url = os.environ['APP_URL'].strip().rstrip('/')
          if not base_url.startswith(('http://', 'https://')):
              base_url = 'https://' + base_url

          def request_json(path, *, required=True, timeout=180, retries=3):
              url = base_url + path
              last_error = None
              for attempt in range(1, retries + 1):
                  print(f'\nGET {url} (attempt {attempt}/{retries})', flush=True)
                  req = urllib.request.Request(
                      url,
                      headers={'Accept': 'application/json', 'User-Agent': 'TennisTerminalWeeklyCalendar/1.0'},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as res:
                          body = res.read().decode('utf-8', errors='replace')
                          print(body[:4000], flush=True)
                          return json.loads(body)
                  except (socket.timeout, TimeoutError, urllib.error.URLError, ConnectionError) as exc:
                      last_error = exc
                      print(f'TRANSIENT ERROR (attempt {attempt}): {exc}', flush=True)
                      if attempt < retries:
                          time.sleep(5 * attempt)
                          continue
                  except Exception as exc:
                      last_error = exc
                      print(f'ERROR: {exc}', flush=True)
                      break
              if required:
                  raise RuntimeError(f'{url} failed after {retries} attempts: {last_error}')
              return {'ok': False, 'error': str(last_error)}

          # 1) Pull this season's calendar from atptour.com.
          import datetime
          this_year = datetime.date.today().year
          request_json(f'/api/scrape-atp-calendar?year={this_year}')

          # 2) And the next ATP season (atptour.com typically lists it in Q4).
          request_json(f'/api/scrape-atp-calendar?year={this_year + 1}', required=False)

          # 3) Merge any duplicates the new rows might have introduced.
          request_json('/api/dedupe-by-code?apply=true', required=False)

          # 4) Try to fill cuts for newly added editions. run-all is bounded
          # and tombstoned, so this is safe to call a handful of times.
          for attempt in range(15):
              data = request_json('/api/run-all', timeout=60)
              if not data.get('hasMore'):
                  break
              time.sleep(2)

          print('\nWeekly calendar refresh complete.', flush=True)
          PY
