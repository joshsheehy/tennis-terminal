name: Railway PZ reachability probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pz-railway-probe.yml'
      - 'src/app/api/probe-pz-public/route.ts'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deploy and run protected Railway probe
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail
          base="${APP_URL%/}"
          [[ "$base" == http* ]] || base="https://$base"
          for n in $(seq 1 12); do
            echo "Attempt $n"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 \
              -H "X-Admin-Secret: $ADMIN_SECRET" \
              "$base/api/probe-pz-public" || true)
            echo "HTTP $code"
            cat /tmp/body 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          exit 1
